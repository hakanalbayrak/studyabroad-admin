<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayfa Bulunamadı — PANELEDU</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/css/site.css" rel="stylesheet">
  <style>
    .wrap { min-height: 70vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; }
    .box { max-width: 440px; }
    .code { font-size: 5rem; font-weight: 900; line-height: 1; margin-bottom: 8px; }
    h1 { font-size: 1.5rem; font-weight: 800; color: var(--text); margin-bottom: 10px; }
    p { color: var(--muted); line-height: 1.6; margin-bottom: 28px; }
    .links { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body class="pe-theme">
  <div class="wrap">
    <div class="box">
      <div class="code pe-grad-text">404</div>
      <h1>Sayfa Bulunamadı</h1>
      <p>Aradığınız sayfa taşınmış, silinmiş ya da hiç var olmamış olabilir.</p>
      <div class="links">
        <a href="/" class="btn-grad"><i class="bi bi-house-fill"></i>Ana Sayfa</a>
        <a href="/match" class="btn-ghost"><i class="bi bi-magic"></i>Okul Bul</a>
        <a href="/test" class="btn-ghost"><i class="bi bi-journal-check"></i>İngilizce Testi</a>
      </div>
    </div>
  </div>
  <script src="/js/chrome.js"></script>
</body>
</html>
