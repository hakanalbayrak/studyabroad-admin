<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affiliate Portal — PANELEDU</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #0b1120; color: #e2e8f0; min-height: 100vh; font-family: system-ui, sans-serif; }
    .topbar { background: #1e293b; border-bottom: 1px solid rgba(255,255,255,.08); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
    .stat-card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 18px 20px; }
    .ref-box { background: rgba(99,102,241,.08); border: 1px solid rgba(99,102,241,.25); border-radius: 10px; padding: 12px 16px; font-family: monospace; font-size: .9rem; color: #a5b4fc; word-break: break-all; }
    table { color: #e2e8f0; }
    .badge-new { background: rgba(239,68,68,.2); color: #f87171; }
    .badge-contacted { background: rgba(234,179,8,.2); color: #fbbf24; }
    .badge-converted { background: rgba(16,185,129,.2); color: #34d399; }
    .badge-closed { background: rgba(107,114,128,.2); color: #9ca3af; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="d-flex align-items-center gap-3">
      <a href="/" style="color:#818cf8;text-decoration:none"><i class="bi bi-globe-americas me-1"></i>PANELEDU</a>
      <span style="color:#334155">|</span>
      <span style="color:#94a3b8;font-size:.88rem">Affiliate Portal</span>
    </div>
    <div class="d-flex align-items-center gap-3">
      <span id="userName" class="small text-muted"></span>
      <button class="btn btn-outline-danger btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Sign Out</button>
    </div>
  </div>

  <div class="container py-4" style="max-width:900px">
    <h4 class="fw-bold mb-1">Affiliate Dashboard</h4>
    <p class="text-muted small mb-4">Track your referrals and commissions</p>

    <!-- Referral link -->
    <div class="mb-4">
      <div class="small fw-semibold text-muted mb-2"><i class="bi bi-link-45deg me-1"></i>Your Referral Link</div>
      <div class="d-flex align-items-center gap-2">
        <div class="ref-box flex-1" id="refLink">Loading…</div>
        <button class="btn btn-outline-primary btn-sm flex-shrink-0" onclick="copyRef()"><i class="bi bi-clipboard me-1"></i>Copy</button>
      </div>
      <div class="small text-muted mt-1">Share this link. Leads from visitors who use it will be attributed to you.</div>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3"><div class="stat-card text-center"><div class="fw-bold fs-3" id="sTotal">—</div><div class="small text-muted">Total Leads</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card text-center"><div class="fw-bold fs-3" style="color:#f87171" id="sNew">—</div><div class="small text-muted">New</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card text-center"><div class="fw-bold fs-3" style="color:#fbbf24" id="sContacted">—</div><div class="small text-muted">Contacted</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card text-center"><div class="fw-bold fs-3" style="color:#34d399" id="sConverted">—</div><div class="small text-muted">Converted</div></div></div>
    </div>

    <!-- Leads table -->
    <h6 class="fw-semibold mb-3">Recent Leads</h6>
    <div id="leadsWrap"><div class="text-muted text-center py-5">Loading…</div></div>
  </div>

  <script>
    const token = localStorage.getItem('sa_token');
    const role = localStorage.getItem('sa_role');
    if (!token || (role !== 'affiliate' && role !== 'admin')) {
      location.href = '/login?next=/affiliate';
    }
    document.getElementById('userName').textContent = localStorage.getItem('sa_name') || '';

    function logout() {
      ['sa_token','sa_role','sa_name'].forEach(k => localStorage.removeItem(k));
      location.href = '/login';
    }

    function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    async function load() {
      const res = await fetch('/api/affiliate/dashboard', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.status === 401) { logout(); return; }
      const d = await res.json();

      const base = location.origin + '/?ref=' + (d.user.affiliate_code || '');
      document.getElementById('refLink').textContent = base;

      const s = d.stats;
      document.getElementById('sTotal').textContent = s.total || 0;
      document.getElementById('sNew').textContent = s.new_count || 0;
      document.getElementById('sContacted').textContent = s.contacted || 0;
      document.getElementById('sConverted').textContent = s.converted || 0;

      if (!d.leads.length) {
        document.getElementById('leadsWrap').innerHTML = '<div class="text-center text-muted py-5">No leads yet. Share your referral link to get started.</div>';
        return;
      }
      document.getElementById('leadsWrap').innerHTML = `<div class="table-responsive">
        <table class="table table-hover table-sm" style="font-size:.85rem">
          <thead style="color:#64748b"><tr><th>Date</th><th>Name</th><th>Email</th><th>Program</th><th>University</th><th>Status</th></tr></thead>
          <tbody>${d.leads.map(l => `<tr>
            <td class="text-muted">${new Date(l.created_at).toLocaleDateString()}</td>
            <td>${esc(l.student_name)}</td>
            <td><a href="mailto:${esc(l.email)}" style="color:#818cf8">${esc(l.email)}</a></td>
            <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.program_name||'—')}</td>
            <td>${esc(l.university_name||'—')}</td>
            <td><span class="badge badge-${l.status}">${l.status}</span></td>
          </tr>`).join('')}</tbody>
        </table></div>`;
    }

    function copyRef() {
      const text = document.getElementById('refLink').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = event.target.closest('button');
        btn.innerHTML = '<i class="bi bi-check2 me-1"></i>Copied!';
        setTimeout(() => { btn.innerHTML = '<i class="bi bi-clipboard me-1"></i>Copy'; }, 2000);
      });
    }

    load();
  </script>
</body>
</html>
