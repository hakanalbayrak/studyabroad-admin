<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Abroad — Find Programs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --accent: #6366f1; }
    body { background: #0b1120; color: #e2e8f0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; }

    /* Nav */
    .top-nav { background: rgba(11,17,32,.95); border-bottom: 1px solid rgba(255,255,255,.08); padding: 12px 0; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(8px); }
    .top-nav a { color: #94a3b8; text-decoration: none; font-size: .85rem; }
    .top-nav a:hover { color: #e2e8f0; }
    .top-nav .page-title { color: #f1f5f9; font-weight: 700; font-size: 1rem; }

    /* Eligibility panel */
    #eligPanel { background: linear-gradient(135deg, rgba(99,102,241,.12) 0%, rgba(192,132,252,.08) 100%); border: 1px solid rgba(99,102,241,.25); border-radius: 16px; padding: 20px 24px; margin-bottom: 24px; }
    #eligPanel h6 { color: #818cf8; font-size: .8rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 14px; }
    .elig-input { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); color: #e2e8f0; border-radius: 8px; font-size: .82rem; padding: 6px 10px; }
    .elig-input:focus { background: rgba(255,255,255,.1); border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,.2); color: #e2e8f0; outline: none; }
    .elig-input::placeholder { color: #475569; }
    .elig-input option { background: #1e293b; }
    .btn-match { background: linear-gradient(135deg, #6366f1, #8b5cf6); border: none; color: #fff; border-radius: 8px; font-size: .82rem; font-weight: 600; padding: 7px 18px; cursor: pointer; }
    .btn-match:hover { opacity: .9; }
    .btn-reset-elig { background: transparent; border: 1px solid rgba(255,255,255,.15); color: #64748b; border-radius: 8px; font-size: .8rem; padding: 6px 14px; cursor: pointer; }
    .btn-reset-elig:hover { border-color: rgba(255,255,255,.3); color: #94a3b8; }

    /* Filter bar */
    #filterBar { background: rgba(255,255,255,.03); border-bottom: 1px solid rgba(255,255,255,.07); padding: 14px 0; position: sticky; top: 53px; z-index: 50; backdrop-filter: blur(8px); }
    #filterBar input, #filterBar select { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); color: #e2e8f0; border-radius: 8px; font-size: .82rem; }
    #filterBar input::placeholder { color: #64748b; }
    #filterBar input:focus, #filterBar select:focus { background: rgba(255,255,255,.1); border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,.2); color: #e2e8f0; outline: none; }
    #filterBar select option { background: #1e293b; }

    /* Stats */
    #statsBar { background: rgba(255,255,255,.02); border-bottom: 1px solid rgba(255,255,255,.06); padding: 8px 0; font-size: .78rem; color: #475569; }
    #statsBar b { color: #64748b; }

    /* Cards */
    #grid { padding: 24px 0 64px; }
    .prog-card {
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px; padding: 16px 18px; transition: all .18s; cursor: pointer;
    }
    .prog-card:hover { background: rgba(99,102,241,.09); border-color: rgba(99,102,241,.35); transform: translateY(-1px); box-shadow: 0 6px 24px rgba(0,0,0,.35); }
    .prog-name { font-size: .9rem; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; line-height: 1.35; }
    .prog-uni { font-size: .78rem; color: #818cf8; margin-bottom: 8px; }
    .prog-uni i { margin-right: 3px; }
    .prog-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .meta-chip { font-size: .7rem; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
    .chip-type { background: rgba(99,102,241,.2); color: #a5b4fc; }
    .chip-lang { background: rgba(6,182,212,.15); color: #67e8f9; }
    .chip-scholar { background: rgba(16,185,129,.2); color: #6ee7b7; }
    .prog-details { display: flex; flex-wrap: wrap; gap: 12px; font-size: .75rem; color: #64748b; margin-top: 6px; }
    .prog-details span { display: flex; align-items: center; gap: 3px; }
    .prog-fee { color: #fcd34d; font-weight: 700; font-size: .82rem; }
    .prog-location { font-size: .73rem; color: #475569; margin-top: 5px; }

    /* Empty / loading */
    #emptyMsg { text-align: center; color: #475569; padding: 80px 0; }
    #loadingMsg { text-align: center; color: #64748b; padding: 80px 0; }
    .spinner-ring { width: 36px; height: 36px; border: 3px solid rgba(99,102,241,.2); border-top-color: #6366f1; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Count */
    #resultCount { font-size: .8rem; color: #475569; }
  </style>
</head>
<body>

<nav class="top-nav">
  <div class="container d-flex align-items-center gap-3">
    <a href="/"><i class="bi bi-arrow-left me-1"></i>Universities</a>
    <span style="color:#334155">|</span>
    <span class="page-title"><i class="bi bi-search me-1" style="color:#818cf8"></i>Find Programs</span>
  </div>
</nav>

<!-- Eligibility banner -->
<div style="background:linear-gradient(90deg,rgba(99,102,241,.08),rgba(139,92,246,.06));border-bottom:1px solid rgba(99,102,241,.15);padding:9px 0">
  <div class="container d-flex align-items-center justify-content-between flex-wrap gap-2">
    <span style="font-size:.82rem;color:#818cf8;font-weight:600"><i class="bi bi-magic me-1"></i>Not sure which programs suit you?</span>
    <button onclick="toggleEligPanel()" id="eligToggleBtn" style="background:rgba(99,102,241,.2);border:1px solid rgba(99,102,241,.4);color:#a5b4fc;border-radius:8px;padding:5px 14px;font-size:.78rem;font-weight:600;cursor:pointer">
      <i class="bi bi-sliders me-1"></i>Check my eligibility
    </button>
  </div>
</div>

<!-- Eligibility panel (collapsed by default) -->
<div id="eligPanel" style="display:none;background:linear-gradient(135deg,rgba(15,23,42,.98),rgba(30,27,75,.95));border-bottom:1px solid rgba(99,102,241,.25);padding:20px 0">
  <div class="container">
    <div class="row g-3 align-items-end">
      <div class="col-12 col-sm-6 col-md-3">
        <label style="font-size:.72rem;color:#64748b;display:block;margin-bottom:4px"><i class="bi bi-bar-chart-fill me-1"></i>Your GPA / Academic Grade</label>
        <div class="input-group input-group-sm">
          <input type="number" id="eligGpa" class="form-control elig-input" placeholder="e.g. 75" min="0" max="100" step="1">
          <span class="input-group-text" style="background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:#64748b;font-size:.8rem">%</span>
        </div>
      </div>
      <div class="col-6 col-sm-3 col-md-2">
        <label style="font-size:.72rem;color:#64748b;display:block;margin-bottom:4px"><i class="bi bi-translate me-1"></i>English Test</label>
        <select id="eligEngType" class="form-select form-select-sm elig-input" onchange="onEligEngTypeChange()">
          <option value="">Select…</option>
          <option value="None">No test</option>
          <option value="IELTS">IELTS</option>
          <option value="TOEFL">TOEFL</option>
          <option value="Duolingo">Duolingo</option>
          <option value="PTE">PTE</option>
          <option value="Cambridge">Cambridge</option>
        </select>
      </div>
      <div class="col-6 col-sm-3 col-md-2" id="eligScoreWrap" style="display:none">
        <label style="font-size:.72rem;color:#64748b;display:block;margin-bottom:4px">Your Score</label>
        <input type="number" id="eligEngScore" class="form-control form-control-sm elig-input" placeholder="e.g. 6.5" step="0.5" min="0">
      </div>
      <div class="col-12 col-sm-6 col-md-3">
        <label style="font-size:.72rem;color:#64748b;display:block;margin-bottom:4px"><i class="bi bi-currency-dollar me-1"></i>Max Tuition Budget ($/year)</label>
        <div class="input-group input-group-sm">
          <span class="input-group-text" style="background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:#64748b;font-size:.8rem">$</span>
          <input type="number" id="eligFee" class="form-control elig-input" placeholder="e.g. 15000" min="0" step="1000">
        </div>
      </div>
      <div class="col-12 col-md-2 d-flex gap-2">
        <button onclick="applyEligibility()" class="btn-match flex-grow-1"><i class="bi bi-magic me-1"></i>Match</button>
        <button onclick="clearEligibility()" class="btn-reset-elig">Reset</button>
      </div>
    </div>
    <div id="eligResult" style="display:none;margin-top:14px;padding:10px 14px;border-radius:10px;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.2);font-size:.82rem;color:#94a3b8"></div>
  </div>
</div>
  <div class="container">
    <div class="row g-2 align-items-center">
      <div class="col-12 col-md-4">
        <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search programs or universities…" oninput="debounceApply()">
      </div>
      <div class="col-6 col-md-2">
        <select class="form-select form-select-sm" id="countryFilter" onchange="applyFilters()">
          <option value="">All Countries</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <select class="form-select form-select-sm" id="typeFilter" onchange="applyFilters()">
          <option value="">All Types</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <select class="form-select form-select-sm" id="langFilter" onchange="applyFilters()">
          <option value="">Any Language</option>
          <option value="English">English</option>
        </select>
      </div>
      <div class="col-6 col-md-2 d-flex gap-2 align-items-center">
        <select class="form-select form-select-sm" id="scholarFilter" onchange="applyFilters()">
          <option value="">All</option>
          <option value="1">Scholarship available</option>
        </select>
      </div>
    </div>
    <div class="row g-2 align-items-center mt-1">
      <div class="col-12 col-md-3">
        <select class="form-select form-select-sm" id="engFilter" onchange="applyFilters()">
          <option value="">Any English req</option>
          <option value="None">No English req</option>
          <option value="IELTS">IELTS</option>
          <option value="TOEFL">TOEFL</option>
          <option value="Duolingo">Duolingo</option>
          <option value="PTE">PTE</option>
          <option value="Cambridge">Cambridge</option>
        </select>
      </div>
      <div class="col-12 col-md-3">
        <div class="input-group input-group-sm">
          <span class="input-group-text" style="background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:#64748b;font-size:.75rem">Max fee $</span>
          <input type="number" class="form-control" id="maxFeeInput" placeholder="e.g. 15000" min="0" step="1000" oninput="debounceApply()">
        </div>
      </div>
      <div class="col-12 col-md-6 text-md-end d-flex align-items-center justify-content-md-end gap-2 flex-wrap">
        <span id="resultCount"></span>
        <select class="form-select form-select-sm" id="perPageSelect" style="width:auto;background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:#94a3b8;font-size:.75rem" onchange="changePerPage()">
          <option value="12">12 / page</option>
          <option value="24" selected>24 / page</option>
          <option value="48">48 / page</option>
          <option value="96">96 / page</option>
        </select>
        <button class="btn btn-sm" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#94a3b8;font-size:.75rem;border-radius:8px" onclick="clearFilters()">
          <i class="bi bi-x-lg me-1"></i>Clear filters
        </button>
      </div>
    </div>
  </div>
</div>

<div id="statsBar">
  <div class="container d-flex gap-4 flex-wrap">
    <span><b id="stTotal">—</b> programs total</span>
    <span><b id="stUnis">—</b> universities</span>
    <span><b id="stScholar">—</b> with scholarships</span>
    <span><b id="stCountries">—</b> countries</span>
  </div>
</div>

<div id="grid">
  <div class="container">
    <div id="loadingMsg"><div class="spinner-ring"></div>Loading programs…</div>
    <div id="emptyMsg" class="d-none"><i class="bi bi-search" style="font-size:2rem;display:block;margin-bottom:12px"></i>No programs match your filters.</div>
    <div class="row g-3" id="cardsContainer"></div>
    <nav id="pagination" class="d-flex justify-content-center align-items-center gap-2 flex-wrap" style="margin-top:24px"></nav>
  </div>
</div>

<script>
let allPrograms = [];
let filteredPrograms = [];
let currentPage = 1;
let perPage = 24;
let debounceTimer = null;
let eligActive = false;
let eligCriteria = {};

async function init() {
  try {
    const [programs, options] = await Promise.all([
      fetch('/api/public/programs?').then(r => r.json()),
      fetch('/api/public/filter-options').then(r => r.json())
    ]);
    allPrograms = programs;
    buildDropdowns(options);
    applyFilters();
    updateStats();
    document.getElementById('loadingMsg').style.display = 'none';
  } catch (e) {
    document.getElementById('loadingMsg').innerHTML = '<i class="bi bi-exclamation-circle" style="font-size:2rem;display:block;margin-bottom:12px;color:#f87171"></i>Could not load programs.';
  }
}

function buildDropdowns({ countries, types }) {
  const cSel = document.getElementById('countryFilter');
  countries.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; cSel.appendChild(o); });
  const tSel = document.getElementById('typeFilter');
  types.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; tSel.appendChild(o); });
}

function debounceApply() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(applyFilters, 250);
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const country = document.getElementById('countryFilter').value;
  const type = document.getElementById('typeFilter').value;
  const lang = document.getElementById('langFilter').value;
  const scholar = document.getElementById('scholarFilter').value;
  const eng = document.getElementById('engFilter').value;
  const maxFee = parseFloat(document.getElementById('maxFeeInput').value) || null;

  filteredPrograms = allPrograms.filter(p => {
    if (q && !p.name.toLowerCase().includes(q) && !p.university_name.toLowerCase().includes(q)) return false;
    if (country && p.country !== country) return false;
    if (type && p.type_name !== type) return false;
    if (lang && !(p.language_of_instruction || '').toLowerCase().includes(lang.toLowerCase())) return false;
    if (scholar === '1' && !p.scholarship_available) return false;
    if (!eligActive && eng && p.english_req_type !== eng) return false;
    if (!eligActive && maxFee !== null && p.tuition_fee !== null && p.tuition_fee > maxFee) return false;
    if (!meetsEligibility(p)) return false;
    return true;
  });

  const count = filteredPrograms.length;
  document.getElementById('resultCount').textContent = count + ' result' + (count !== 1 ? 's' : '');
  currentPage = 1;
  renderCards();
}

function changePerPage() {
  perPage = parseInt(document.getElementById('perPageSelect').value) || 24;
  currentPage = 1;
  renderCards();
}

function goToPage(p) {
  const totalPages = Math.max(1, Math.ceil(filteredPrograms.length / perPage));
  currentPage = Math.min(Math.max(1, p), totalPages);
  renderCards();
  document.getElementById('grid').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function clearFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('countryFilter').value = '';
  document.getElementById('typeFilter').value = '';
  document.getElementById('langFilter').value = '';
  document.getElementById('scholarFilter').value = '';
  document.getElementById('engFilter').value = '';
  document.getElementById('maxFeeInput').value = '';
  applyFilters();
}

function updateStats() {
  document.getElementById('stTotal').textContent = allPrograms.length.toLocaleString();
  const unis = new Set(allPrograms.map(p => p.university_id));
  document.getElementById('stUnis').textContent = unis.size;
  document.getElementById('stScholar').textContent = allPrograms.filter(p => p.scholarship_available).length.toLocaleString();
  const countries = new Set(allPrograms.map(p => p.country).filter(Boolean));
  document.getElementById('stCountries').textContent = countries.size;
}

function renderCards() {
  const container = document.getElementById('cardsContainer');
  const empty = document.getElementById('emptyMsg');

  if (!filteredPrograms.length) {
    container.innerHTML = '';
    document.getElementById('pagination').innerHTML = '';
    empty.classList.remove('d-none');
    return;
  }
  empty.classList.add('d-none');

  const totalPages = Math.max(1, Math.ceil(filteredPrograms.length / perPage));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * perPage;
  const shown = filteredPrograms.slice(start, start + perPage);
  container.innerHTML = shown.map(p => {
    const fee = p.tuition_fee
      ? `<span class="prog-fee">$${Number(p.tuition_fee).toLocaleString()}</span>`
      : '<span style="color:#475569;font-size:.75rem">Fee on request</span>';
    const engReq = p.english_req_type && p.english_req_type !== 'None'
      ? `<span><i class="bi bi-translate"></i>${p.english_req_type}${p.english_req_score ? ' ' + p.english_req_score : ''}</span>`
      : '';
    const gpa = p.gpa_requirement ? `<span><i class="bi bi-bar-chart-fill"></i>GPA ${p.gpa_requirement}</span>` : '';
    const duration = p.duration ? `<span><i class="bi bi-calendar3"></i>${p.duration}</span>` : '';
    const intake = p.intake_months ? `<span><i class="bi bi-calendar-event"></i>${p.intake_months}</span>` : '';

    return `<div class="col-12 col-md-6 col-xl-4">
      <div class="prog-card h-100 d-flex flex-column" onclick="window.location.href='/university?id=${p.university_id}'">
        <div style="flex:1">
          <div class="prog-name">${esc(p.name)}</div>
          <div class="prog-uni"><i class="bi bi-building"></i>${esc(p.university_name)}</div>
          <div class="prog-meta">
            <span class="meta-chip chip-type">${esc(p.type_name)}</span>
            ${p.language_of_instruction ? `<span class="meta-chip chip-lang"><i class="bi bi-translate me-1"></i>${esc(p.language_of_instruction)}</span>` : ''}
            ${p.scholarship_available ? `<span class="meta-chip chip-scholar"><i class="bi bi-award-fill me-1"></i>Scholarship</span>` : ''}
          </div>
          <div class="d-flex align-items-center justify-content-between">
            ${fee}
            <span class="prog-location"><i class="bi bi-geo-alt-fill me-1" style="color:#475569"></i>${[p.city, p.country].filter(Boolean).join(', ')}</span>
          </div>
          ${(duration || intake || engReq || gpa) ? `<div class="prog-details">${[duration, intake, engReq, gpa].filter(Boolean).join('')}</div>` : ''}
        </div>
        <div style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06)">
          <button class="btn btn-sm w-100" style="background:rgba(99,102,241,.18);border:1px solid rgba(99,102,241,.35);color:#a5b4fc;font-size:.78rem;font-weight:600;border-radius:8px"
            onclick="event.stopPropagation();openLeadModal(${p.id})">
            <i class="bi bi-envelope-fill me-1"></i>Request Info
          </button>
        </div>
      </div>
    </div>`;
  }).join('');

  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const nav = document.getElementById('pagination');
  if (totalPages <= 1) { nav.innerHTML = ''; return; }

  const btn = (label, page, opts = {}) => {
    const { disabled = false, active = false } = opts;
    const base = 'border:1px solid rgba(255,255,255,.12);font-size:.8rem;border-radius:8px;min-width:38px;padding:6px 10px;';
    const style = active
      ? base + 'background:#6366f1;color:#fff;border-color:#6366f1;font-weight:600'
      : base + `background:rgba(255,255,255,.05);color:${disabled ? '#475569' : '#cbd5e1'};` + (disabled ? 'cursor:not-allowed' : 'cursor:pointer');
    return `<button class="btn btn-sm" style="${style}" ${disabled ? 'disabled' : `onclick="goToPage(${page})"`}>${label}</button>`;
  };

  // page window: show first, last, current ±2, with ellipses
  const pages = [];
  const win = 2;
  for (let p = 1; p <= totalPages; p++) {
    if (p === 1 || p === totalPages || (p >= currentPage - win && p <= currentPage + win)) pages.push(p);
    else if (pages[pages.length - 1] !== '…') pages.push('…');
  }

  let html = btn('<i class="bi bi-chevron-left"></i>', currentPage - 1, { disabled: currentPage === 1 });
  html += pages.map(p => p === '…'
    ? `<span style="color:#475569;padding:0 4px">…</span>`
    : btn(p, p, { active: p === currentPage })).join('');
  html += btn('<i class="bi bi-chevron-right"></i>', currentPage + 1, { disabled: currentPage === totalPages });
  html += `<span style="color:#475569;font-size:.78rem;margin-left:8px">Page ${currentPage} of ${totalPages}</span>`;
  nav.innerHTML = html;
}

function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Eligibility checker ───────────────────────────────────────────────────────
function toggleEligPanel() {
  const panel = document.getElementById('eligPanel');
  const btn = document.getElementById('eligToggleBtn');
  const opening = panel.style.display === 'none';
  panel.style.display = opening ? 'block' : 'none';
  btn.innerHTML = opening
    ? '<i class="bi bi-x-lg me-1"></i>Close'
    : '<i class="bi bi-sliders me-1"></i>Check my eligibility';
}

function onEligEngTypeChange() {
  const type = document.getElementById('eligEngType').value;
  document.getElementById('eligScoreWrap').style.display = (type && type !== 'None') ? 'block' : 'none';
}

function meetsEligibility(p) {
  if (!eligActive) return true;
  const { gpa, engType, engScore, maxFee } = eligCriteria;

  if (gpa !== null) {
    if (p.gpa_requirement) {
      const req = parseFloat(p.gpa_requirement);
      if (!isNaN(req) && gpa < req) return false;
    }
  }

  if (engType) {
    const progEng = p.english_req_type || 'None';
    if (engType === 'None') {
      if (progEng !== 'None') return false;
    } else {
      if (progEng !== 'None') {
        if (progEng !== engType) return false;
        if (engScore !== null && p.english_req_score !== null) {
          if (parseFloat(p.english_req_score) > engScore) return false;
        }
      }
    }
  }

  if (maxFee !== null && p.tuition_fee !== null && p.tuition_fee > maxFee) return false;

  return true;
}

function applyEligibility() {
  const gpa = parseFloat(document.getElementById('eligGpa').value);
  const engType = document.getElementById('eligEngType').value || null;
  const engScore = parseFloat(document.getElementById('eligEngScore').value);
  const maxFee = parseFloat(document.getElementById('eligFee').value);

  eligCriteria = {
    gpa: isNaN(gpa) ? null : gpa,
    engType,
    engScore: isNaN(engScore) ? null : engScore,
    maxFee: isNaN(maxFee) ? null : maxFee
  };
  eligActive = !!(eligCriteria.gpa !== null || eligCriteria.engType || eligCriteria.maxFee !== null);

  applyFilters();

  const el = document.getElementById('eligResult');
  el.style.display = 'block';
  const n = filteredPrograms.length;
  const criteria = [];
  if (eligCriteria.gpa !== null) criteria.push(`GPA ${eligCriteria.gpa}%`);
  if (eligCriteria.engType === 'None') criteria.push('no English test');
  else if (eligCriteria.engType) criteria.push(`${eligCriteria.engType}${eligCriteria.engScore !== null ? ' ' + eligCriteria.engScore : ''}`);
  if (eligCriteria.maxFee !== null) criteria.push(`budget $${eligCriteria.maxFee.toLocaleString()}`);
  el.innerHTML = `<i class="bi bi-check-circle-fill me-1" style="color:#6ee7b7"></i>
    <b style="color:#f1f5f9">${n} program${n !== 1 ? 's' : ''}</b> match your profile
    ${criteria.length ? `<span style="color:#64748b"> · ${criteria.join(', ')}</span>` : ''}.
    <button onclick="clearEligibility()" style="background:none;border:none;color:#818cf8;font-size:.78rem;cursor:pointer;margin-left:8px;text-decoration:underline">Clear</button>`;
}

function clearEligibility() {
  document.getElementById('eligGpa').value = '';
  document.getElementById('eligEngType').value = '';
  document.getElementById('eligEngScore').value = '';
  document.getElementById('eligFee').value = '';
  document.getElementById('eligScoreWrap').style.display = 'none';
  document.getElementById('eligResult').style.display = 'none';
  document.getElementById('maxFeeInput').value = '';
  document.getElementById('engFilter').value = '';
  eligActive = false;
  eligCriteria = {};
  applyFilters();
}

// ── Lead modal ────────────────────────────────────────────────────────────────
let leadCtx = {};

function openLeadModal(programId) {
  const p = allPrograms.find(x => x.id === programId);
  if (!p) return;
  leadCtx = { programId, programName: p.name, universityId: p.university_id, universityName: p.university_name, country: p.country };
  document.getElementById('leadProgName').textContent = leadCtx.programName;
  document.getElementById('leadUniName').textContent = leadCtx.universityName;
  document.getElementById('leadName').value = '';
  document.getElementById('leadEmail').value = '';
  document.getElementById('leadPhone').value = '';
  document.getElementById('leadMsg').value = '';
  document.getElementById('leadError').textContent = '';
  document.getElementById('leadSuccess').classList.add('d-none');
  document.getElementById('leadFormBody').classList.remove('d-none');
  document.getElementById('leadModal').style.display = 'flex';
}

function closeLeadModal() {
  document.getElementById('leadModal').style.display = 'none';
}

async function submitLead() {
  const btn = document.getElementById('leadSubmitBtn');
  const errEl = document.getElementById('leadError');
  errEl.textContent = '';
  const name = document.getElementById('leadName').value.trim();
  const email = document.getElementById('leadEmail').value.trim();
  const phone = document.getElementById('leadPhone').value.trim();
  const message = document.getElementById('leadMsg').value.trim();
  if (!name || !email) { errEl.textContent = 'Name and email are required.'; return; }
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const r = await fetch('/api/public/leads', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        student_name: name, email, phone, message,
        program_id: leadCtx.programId, program_name: leadCtx.programName,
        university_id: leadCtx.universityId, university_name: leadCtx.universityName,
        country: leadCtx.country
      })
    });
    const d = await r.json();
    if (!r.ok) { errEl.textContent = d.error || 'Something went wrong.'; return; }
    document.getElementById('leadFormBody').classList.add('d-none');
    document.getElementById('leadSuccess').classList.remove('d-none');
  } catch (e) {
    errEl.textContent = 'Network error — please try again.';
  } finally {
    btn.disabled = false; btn.textContent = 'Send Request';
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLeadModal(); });

init();
</script>

<!-- Lead Modal -->
<div id="leadModal" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.7);align-items:center;justify-content:center;padding:16px" onclick="if(event.target===this)closeLeadModal()">
  <div style="background:#1e293b;border:1px solid rgba(255,255,255,.12);border-radius:16px;width:100%;max-width:480px;padding:28px 28px 24px">
    <div class="d-flex justify-content-between align-items-start mb-3">
      <div>
        <div style="font-size:.7rem;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Request Information</div>
        <div id="leadProgName" style="font-size:1rem;font-weight:700;color:#f1f5f9;line-height:1.3"></div>
        <div id="leadUniName" style="font-size:.82rem;color:#818cf8;margin-top:2px"></div>
      </div>
      <button onclick="closeLeadModal()" style="background:none;border:none;color:#475569;font-size:1.2rem;cursor:pointer;padding:0 0 0 12px">&times;</button>
    </div>

    <div id="leadFormBody">
      <div class="mb-3">
        <input id="leadName" type="text" placeholder="Your full name *" style="width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#e2e8f0;border-radius:8px;padding:9px 12px;font-size:.88rem;outline:none" onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='rgba(255,255,255,.12)'">
      </div>
      <div class="mb-3">
        <input id="leadEmail" type="email" placeholder="Email address *" style="width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#e2e8f0;border-radius:8px;padding:9px 12px;font-size:.88rem;outline:none" onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='rgba(255,255,255,.12)'">
      </div>
      <div class="mb-3">
        <input id="leadPhone" type="tel" placeholder="Phone / WhatsApp (optional)" style="width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#e2e8f0;border-radius:8px;padding:9px 12px;font-size:.88rem;outline:none" onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='rgba(255,255,255,.12)'">
      </div>
      <div class="mb-3">
        <textarea id="leadMsg" rows="3" placeholder="Any questions or comments (optional)" style="width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#e2e8f0;border-radius:8px;padding:9px 12px;font-size:.88rem;outline:none;resize:vertical" onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='rgba(255,255,255,.12)'"></textarea>
      </div>
      <div id="leadError" style="color:#f87171;font-size:.8rem;margin-bottom:8px"></div>
      <div class="d-flex gap-2">
        <button id="leadSubmitBtn" onclick="submitLead()" style="flex:1;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;color:#fff;font-weight:700;font-size:.9rem;padding:10px;border-radius:8px;cursor:pointer">Send Request</button>
        <button onclick="closeLeadModal()" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#94a3b8;font-size:.88rem;padding:10px 16px;border-radius:8px;cursor:pointer">Cancel</button>
      </div>
    </div>

    <div id="leadSuccess" class="d-none text-center" style="padding:16px 0">
      <div style="font-size:2.5rem;margin-bottom:12px">✅</div>
      <div style="font-size:1.05rem;font-weight:700;color:#f1f5f9;margin-bottom:6px">Request sent!</div>
      <div style="font-size:.85rem;color:#94a3b8;margin-bottom:20px">We'll be in touch soon.</div>
      <button onclick="closeLeadModal()" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#94a3b8;font-size:.88rem;padding:8px 20px;border-radius:8px;cursor:pointer">Close</button>
    </div>
  </div>
</div>
