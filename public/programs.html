<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yurt Dışı Programlar — PANELEDU</title>
  <meta name="description" content="Yurt dışındaki üniversitelerin İngilizce lisans ve yüksek lisans programlarını incele. Uygunluk kontrolü yap, başvur.">
  <meta property="og:title" content="Programlar — PANELEDU">
  <meta property="og:url" content="https://paneledu.com/programs">
  <link rel="canonical" href="https://paneledu.com/programs">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/site.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    /* Eligibility panel */
    #eligPanel { background: var(--grad-soft); border: 1px solid rgba(99,102,241,.25); border-radius: 16px; padding: 20px 24px; margin-bottom: 24px; }
    #eligPanel h6 { color: var(--accent); font-size: .8rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 14px; }
    .elig-input { background: var(--surface); border: 1px solid var(--line); color: var(--text); border-radius: 8px; font-size: .82rem; padding: 6px 10px; }
    .elig-input:focus { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,.2); color: var(--text); outline: none; }
    .elig-input::placeholder { color: var(--muted); }
    .elig-input option { background: #fff; }
    .btn-match { background: var(--grad); border: none; color: #fff; border-radius: 8px; font-size: .82rem; font-weight: 600; padding: 7px 18px; cursor: pointer; }
    .btn-match:hover { opacity: .9; }
    .btn-reset-elig { background: var(--surface); border: 1px solid var(--line); color: var(--muted); border-radius: 8px; font-size: .8rem; padding: 6px 14px; cursor: pointer; }
    .btn-reset-elig:hover { border-color: var(--accent); color: var(--accent); }

    /* Filter bar */
    #filterBar { background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 0; position: sticky; top: 53px; z-index: 50; backdrop-filter: blur(8px); }
    #filterBar input, #filterBar select { background: var(--surface); border: 1px solid var(--line); color: var(--text); border-radius: 8px; font-size: .82rem; }
    #filterBar input::placeholder { color: var(--muted); }
    #filterBar input:focus, #filterBar select:focus { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,.2); color: var(--text); outline: none; }
    #filterBar select option { background: #fff; }

    /* Stats */
    #statsBar { background: var(--surface-2); border-bottom: 1px solid var(--line); padding: 8px 0; font-size: .78rem; color: var(--muted); }
    #statsBar b { color: var(--text); }

    /* Cards */
    #grid { padding: 24px 0 64px; }
    .prog-card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 14px; padding: 16px 18px; transition: all .18s; cursor: pointer; box-shadow: var(--shadow);
    }
    .prog-card:hover { border-color: rgba(99,102,241,.35); transform: translateY(-1px); box-shadow: var(--shadow-lg); }
    .prog-name { font-size: .9rem; font-weight: 700; color: var(--text); margin-bottom: 4px; line-height: 1.35; }
    .prog-uni { font-size: .78rem; color: var(--accent); margin-bottom: 8px; }
    .prog-uni i { margin-right: 3px; }
    .prog-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .meta-chip { font-size: .7rem; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
    .chip-type { background: rgba(99,102,241,.12); color: #4f46e5; }
    .chip-lang { background: rgba(6,182,212,.12); color: #0891b2; }
    .chip-scholar { background: rgba(16,185,129,.14); color: #059669; }
    .prog-details { display: flex; flex-wrap: wrap; gap: 12px; font-size: .75rem; color: var(--muted); margin-top: 6px; }
    .prog-details span { display: flex; align-items: center; gap: 3px; }
    .prog-fee { color: #b45309; font-weight: 700; font-size: .82rem; }
    .prog-location { font-size: .73rem; color: var(--muted); margin-top: 5px; }

    /* Empty / loading */
    #emptyMsg { text-align: center; color: var(--muted); padding: 80px 0; }
    #loadingMsg { text-align: center; color: var(--muted); padding: 80px 0; }
    .spinner-ring { width: 36px; height: 36px; border: 3px solid rgba(99,102,241,.2); border-top-color: #6366f1; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Count */
    #resultCount { font-size: .8rem; color: var(--muted); }
  </style>
</head>
<body class="pe-theme">

<!-- Eligibility banner -->
<div style="background:var(--grad-soft);border-bottom:1px solid rgba(99,102,241,.15);padding:9px 0">
  <div class="container d-flex align-items-center justify-content-between flex-wrap gap-2">
    <span style="font-size:.82rem;color:var(--accent);font-weight:600"><i class="bi bi-magic me-1"></i>Not sure which programs suit you?</span>
    <button onclick="toggleEligPanel()" id="eligToggleBtn" style="background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.4);color:var(--accent);border-radius:8px;padding:5px 14px;font-size:.78rem;font-weight:600;cursor:pointer">
      <i class="bi bi-sliders me-1"></i>Check my eligibility
    </button>
  </div>
</div>

<!-- Eligibility panel (collapsed by default) -->
<div id="eligPanel" style="display:none;background:var(--surface-2);border-bottom:1px solid rgba(99,102,241,.25);padding:20px 0">
  <div class="container">
    <div class="row g-3 align-items-end">
      <div class="col-6 col-md-3">
        <label style="font-size:.72rem;color:var(--muted);display:block;margin-bottom:4px"><i class="bi bi-mortarboard-fill me-1"></i>Highest education completed</label>
        <select id="eligLevel" class="form-select form-select-sm elig-input">
          <option value="none">None / not specified</option>
          <option value="highschool">High school</option>
          <option value="bachelor">Bachelor</option>
          <option value="master">Master</option>
          <option value="phd">PhD</option>
        </select>
      </div>
      <div class="col-6 col-md-3">
        <label style="font-size:.72rem;color:var(--muted);display:block;margin-bottom:4px"><i class="bi bi-patch-check-fill me-1"></i>Qualification</label>
        <div class="input-group input-group-sm">
          <select id="eligQualType" class="form-select form-select-sm elig-input">
            <option value="">—</option>
            <option value="IB">IB</option>
            <option value="A-Level">A-Level</option>
            <option value="AP">AP</option>
            <option value="National Diploma">National Diploma</option>
            <option value="Foundation">Foundation</option>
            <option value="Other">Other</option>
          </select>
          <input type="text" id="eligQualValue" class="form-control elig-input" placeholder='e.g. "34" or "AAB"'>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <label style="font-size:.72rem;color:var(--muted);display:block;margin-bottom:4px"><i class="bi bi-bar-chart-fill me-1"></i>Your GPA</label>
        <div class="input-group input-group-sm">
          <input type="number" id="eligGpa" class="form-control elig-input" placeholder="e.g. 3.2" min="0" step="0.01">
          <select id="eligGpaScale" class="form-select elig-input" style="max-width:80px">
            <option value="4.0">/4.0</option>
            <option value="4.3">/4.3</option>
            <option value="5.0">/5.0</option>
            <option value="10.0">/10.0</option>
            <option value="20">/20</option>
            <option value="100">/100</option>
          </select>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <label style="font-size:.72rem;color:var(--muted);display:block;margin-bottom:4px"><i class="bi bi-translate me-1"></i>English test</label>
        <div class="input-group input-group-sm">
          <select id="eligEngType" class="form-select form-select-sm elig-input">
            <option value="">—</option>
            <option value="IELTS">IELTS</option>
            <option value="TOEFL">TOEFL</option>
            <option value="Duolingo">Duolingo</option>
            <option value="PTE">PTE</option>
            <option value="Cambridge">Cambridge</option>
          </select>
          <input type="number" id="eligEngScore" class="form-control elig-input" placeholder="score" step="0.5" min="0">
        </div>
      </div>
      <div class="col-6 col-md-3">
        <label style="font-size:.72rem;color:var(--muted);display:block;margin-bottom:4px"><i class="bi bi-clipboard-data-fill me-1"></i>Standardized test (optional)</label>
        <div class="input-group input-group-sm">
          <select id="eligStdType" class="form-select form-select-sm elig-input">
            <option value="">—</option>
            <option value="GRE">GRE</option>
            <option value="GMAT">GMAT</option>
            <option value="SAT">SAT</option>
          </select>
          <input type="number" id="eligStdScore" class="form-control elig-input" placeholder="score" step="1" min="0">
        </div>
      </div>
      <div class="col-6 col-md-3">
        <label style="font-size:.72rem;color:var(--muted);display:block;margin-bottom:4px"><i class="bi bi-currency-dollar me-1"></i>Max tuition budget ($/year)</label>
        <div class="input-group input-group-sm">
          <span class="input-group-text" style="background:var(--surface-2);border-color:var(--line);color:var(--muted);font-size:.8rem">$</span>
          <input type="number" id="eligFee" class="form-control elig-input" placeholder="e.g. 15000" min="0" step="1000">
        </div>
      </div>
      <div class="col-12 col-md-4 d-flex align-items-center gap-3">
        <label class="d-flex align-items-center gap-2" style="font-size:.78rem;color:var(--text);cursor:pointer;margin:0">
          <input type="checkbox" id="eligOnlyEligible" checked style="accent-color:#6366f1;width:16px;height:16px">
          Show only eligible programs
        </label>
      </div>
      <div class="col-12 col-md-2 d-flex gap-2">
        <button onclick="applyEligibility()" class="btn-match flex-grow-1"><i class="bi bi-magic me-1"></i>Match</button>
        <button onclick="clearEligibility()" class="btn-reset-elig">Reset</button>
      </div>
    </div>
    <div id="eligResult" style="display:none;margin-top:14px;padding:10px 14px;border-radius:10px;background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.2);font-size:.82rem;color:var(--muted)"></div>
  </div>
</div>
  <div class="container">
    <div class="row g-2 align-items-center">
      <div class="col-12 col-md-4">
        <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search programs or universities…" oninput="debounceApply()">
      </div>
      <div class="col-6 col-md-2">
        <select class="form-select form-select-sm" id="countryFilter" onchange="applyFilters()">
          <option value="">All Countries</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <select class="form-select form-select-sm" id="typeFilter" onchange="applyFilters()">
          <option value="">All Types</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <select class="form-select form-select-sm" id="langFilter" onchange="applyFilters()">
          <option value="">Any Language</option>
          <option value="English">English</option>
        </select>
      </div>
      <div class="col-6 col-md-2 d-flex gap-2 align-items-center">
        <select class="form-select form-select-sm" id="scholarFilter" onchange="applyFilters()">
          <option value="">All</option>
          <option value="1">Scholarship available</option>
        </select>
      </div>
    </div>
    <div class="row g-2 align-items-center mt-1">
      <div class="col-12 col-md-3">
        <select class="form-select form-select-sm" id="engFilter" onchange="applyFilters()">
          <option value="">Any English req</option>
          <option value="None">No English req</option>
          <option value="IELTS">IELTS</option>
          <option value="TOEFL">TOEFL</option>
          <option value="Duolingo">Duolingo</option>
          <option value="PTE">PTE</option>
          <option value="Cambridge">Cambridge</option>
        </select>
      </div>
      <div class="col-12 col-md-3">
        <div class="input-group input-group-sm">
          <span class="input-group-text" style="background:var(--surface-2);border-color:var(--line);color:var(--muted);font-size:.75rem">Max fee $</span>
          <input type="number" class="form-control" id="maxFeeInput" placeholder="e.g. 15000" min="0" step="1000" oninput="debounceApply()">
        </div>
      </div>
      <div class="col-12 col-md-6 text-md-end d-flex align-items-center justify-content-md-end gap-2 flex-wrap">
        <span id="resultCount"></span>
        <select class="form-select form-select-sm" id="perPageSelect" style="width:auto;background:var(--surface);border-color:var(--line);color:var(--muted);font-size:.75rem" onchange="changePerPage()">
          <option value="12">12 / page</option>
          <option value="24" selected>24 / page</option>
          <option value="48">48 / page</option>
          <option value="96">96 / page</option>
        </select>
        <button class="btn btn-sm" style="background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:.75rem;border-radius:8px" onclick="clearFilters()">
          <i class="bi bi-x-lg me-1"></i>Clear filters
        </button>
      </div>
    </div>
  </div>
</div>

<div id="statsBar">
  <div class="container d-flex gap-4 flex-wrap">
    <span><b id="stTotal">—</b> programs total</span>
    <span><b id="stUnis">—</b> universities</span>
    <span><b id="stScholar">—</b> with scholarships</span>
    <span><b id="stCountries">—</b> countries</span>
  </div>
</div>

<div id="grid">
  <div class="container">
    <div id="loadingMsg"><div class="spinner-ring"></div>Loading programs…</div>
    <div id="emptyMsg" class="d-none"><i class="bi bi-search" style="font-size:2rem;display:block;margin-bottom:12px"></i>No programs match your filters.</div>
    <div class="row g-3" id="cardsContainer"></div>
    <nav id="pagination" class="d-flex justify-content-center align-items-center gap-2 flex-wrap" style="margin-top:24px"></nav>
  </div>
</div>

<script src="/js/eligibility.js"></script>
<script>
let allPrograms = [];
let filteredPrograms = [];
let currentPage = 1;
let perPage = 24;
let debounceTimer = null;
let eligActive = false;
let eligCriteria = {};

async function init() {
  try {
    const [programs, options] = await Promise.all([
      fetch('/api/public/programs?').then(r => r.json()),
      fetch('/api/public/filter-options').then(r => r.json())
    ]);
    allPrograms = programs;
    buildDropdowns(options);
    applyFilters();
    updateStats();
    document.getElementById('loadingMsg').style.display = 'none';
  } catch (e) {
    document.getElementById('loadingMsg').innerHTML = '<i class="bi bi-exclamation-circle" style="font-size:2rem;display:block;margin-bottom:12px;color:#ef4444"></i>Could not load programs.';
  }
}

function buildDropdowns({ countries, types }) {
  const cSel = document.getElementById('countryFilter');
  countries.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; cSel.appendChild(o); });
  const tSel = document.getElementById('typeFilter');
  types.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; tSel.appendChild(o); });
}

function debounceApply() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(applyFilters, 250);
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const country = document.getElementById('countryFilter').value;
  const type = document.getElementById('typeFilter').value;
  const lang = document.getElementById('langFilter').value;
  const scholar = document.getElementById('scholarFilter').value;
  const eng = document.getElementById('engFilter').value;
  const maxFee = parseFloat(document.getElementById('maxFeeInput').value) || null;

  filteredPrograms = allPrograms.filter(p => {
    if (q && !p.name.toLowerCase().includes(q) && !p.university_name.toLowerCase().includes(q)) return false;
    if (country && p.country !== country) return false;
    if (type && p.type_name !== type) return false;
    if (lang && !(p.language_of_instruction || '').toLowerCase().includes(lang.toLowerCase())) return false;
    if (scholar === '1' && !p.scholarship_available) return false;
    if (!eligActive && eng && p.english_req_type !== eng) return false;
    if (!eligActive && maxFee !== null && p.tuition_fee !== null && p.tuition_fee > maxFee) return false;
    if (!meetsEligibility(p)) return false;
    return true;
  });

  const count = filteredPrograms.length;
  document.getElementById('resultCount').textContent = count + ' result' + (count !== 1 ? 's' : '');
  currentPage = 1;
  renderCards();
}

function changePerPage() {
  perPage = parseInt(document.getElementById('perPageSelect').value) || 24;
  currentPage = 1;
  renderCards();
}

function goToPage(p) {
  const totalPages = Math.max(1, Math.ceil(filteredPrograms.length / perPage));
  currentPage = Math.min(Math.max(1, p), totalPages);
  renderCards();
  document.getElementById('grid').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function clearFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('countryFilter').value = '';
  document.getElementById('typeFilter').value = '';
  document.getElementById('langFilter').value = '';
  document.getElementById('scholarFilter').value = '';
  document.getElementById('engFilter').value = '';
  document.getElementById('maxFeeInput').value = '';
  applyFilters();
}

function updateStats() {
  document.getElementById('stTotal').textContent = allPrograms.length.toLocaleString();
  const unis = new Set(allPrograms.map(p => p.university_id));
  document.getElementById('stUnis').textContent = unis.size;
  document.getElementById('stScholar').textContent = allPrograms.filter(p => p.scholarship_available).length.toLocaleString();
  const countries = new Set(allPrograms.map(p => p.country).filter(Boolean));
  document.getElementById('stCountries').textContent = countries.size;
}

function renderCards() {
  const container = document.getElementById('cardsContainer');
  const empty = document.getElementById('emptyMsg');

  if (!filteredPrograms.length) {
    container.innerHTML = '';
    document.getElementById('pagination').innerHTML = '';
    empty.classList.remove('d-none');
    return;
  }
  empty.classList.add('d-none');

  const totalPages = Math.max(1, Math.ceil(filteredPrograms.length / perPage));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * perPage;
  const shown = filteredPrograms.slice(start, start + perPage);
  container.innerHTML = shown.map(p => {
    const fee = p.tuition_fee
      ? `<span class="prog-fee">$${Number(p.tuition_fee).toLocaleString()}</span>`
      : '<span style="color:var(--muted);font-size:.75rem">Fee on request</span>';
    const engReq = p.english_req_type && p.english_req_type !== 'None'
      ? `<span><i class="bi bi-translate"></i>${p.english_req_type}${p.english_req_score ? ' ' + p.english_req_score : ''}</span>`
      : '';
    const gpa = p.gpa_requirement ? `<span><i class="bi bi-bar-chart-fill"></i>GPA ${p.gpa_requirement}</span>` : '';
    const duration = p.duration ? `<span><i class="bi bi-calendar3"></i>${p.duration}</span>` : '';
    const intake = p.intake_months ? `<span><i class="bi bi-calendar-event"></i>${p.intake_months}</span>` : '';

    // Eligibility breakdown — only for programs that have structured requirements_json.
    let eligBlock = '';
    if (eligActive) {
      const m = eligMatch(p);
      if (m) {
        if (m.eligible) {
          eligBlock = `<div style="margin-top:10px"><span style="display:inline-block;background:rgba(16,185,129,.14);border:1px solid rgba(16,185,129,.4);color:#059669;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px"><i class="bi bi-check-circle-fill me-1"></i>Eligible</span></div>`;
        } else {
          const fails = m.results.filter(r => !r.pass)
            .map(r => `<span style="display:inline-block;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);color:#dc2626;font-size:.68rem;padding:2px 8px;border-radius:999px;margin:2px 3px 0 0">${esc(r.label + (r.detail ? ': ' + r.detail : ''))}</span>`)
            .join('');
          eligBlock = `<div style="margin-top:10px"><span style="display:inline-block;background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.4);color:#b45309;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px"><i class="bi bi-exclamation-circle-fill me-1"></i>Partial</span><div style="margin-top:6px">${fails}</div></div>`;
        }
      }
    }

    return `<div class="col-12 col-md-6 col-xl-4">
      <div class="prog-card h-100 d-flex flex-column" onclick="window.location.href='/university?id=${p.university_id}'">
        <div style="flex:1">
          <div class="prog-name">${esc(p.name)}</div>
          <div class="prog-uni"><i class="bi bi-building"></i>${esc(p.university_name)}</div>
          <div class="prog-meta">
            <span class="meta-chip chip-type">${esc(p.type_name)}</span>
            ${p.language_of_instruction ? `<span class="meta-chip chip-lang"><i class="bi bi-translate me-1"></i>${esc(p.language_of_instruction)}</span>` : ''}
            ${p.scholarship_available ? `<span class="meta-chip chip-scholar"><i class="bi bi-award-fill me-1"></i>Scholarship</span>` : ''}
          </div>
          <div class="d-flex align-items-center justify-content-between">
            ${fee}
            <span class="prog-location"><i class="bi bi-geo-alt-fill me-1" style="color:var(--muted)"></i>${[p.city, p.country].filter(Boolean).join(', ')}</span>
          </div>
          ${(duration || intake || engReq || gpa) ? `<div class="prog-details">${[duration, intake, engReq, gpa].filter(Boolean).join('')}</div>` : ''}
          ${eligBlock}
        </div>
        <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">
          <button class="btn btn-sm w-100" style="background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.35);color:var(--accent);font-size:.78rem;font-weight:600;border-radius:8px"
            onclick="event.stopPropagation();openLeadModal(${p.id})">
            <i class="bi bi-envelope-fill me-1"></i>Request Info
          </button>
        </div>
      </div>
    </div>`;
  }).join('');

  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const nav = document.getElementById('pagination');
  if (totalPages <= 1) { nav.innerHTML = ''; return; }

  const btn = (label, page, opts = {}) => {
    const { disabled = false, active = false } = opts;
    const base = 'border:1px solid var(--line);font-size:.8rem;border-radius:8px;min-width:38px;padding:6px 10px;';
    const style = active
      ? base + 'background:#6366f1;color:#fff;border-color:#6366f1;font-weight:600'
      : base + `background:var(--surface);color:${disabled ? 'var(--muted)' : 'var(--text)'};` + (disabled ? 'cursor:not-allowed' : 'cursor:pointer');
    return `<button class="btn btn-sm" style="${style}" ${disabled ? 'disabled' : `onclick="goToPage(${page})"`}>${label}</button>`;
  };

  // page window: show first, last, current ±2, with ellipses
  const pages = [];
  const win = 2;
  for (let p = 1; p <= totalPages; p++) {
    if (p === 1 || p === totalPages || (p >= currentPage - win && p <= currentPage + win)) pages.push(p);
    else if (pages[pages.length - 1] !== '…') pages.push('…');
  }

  let html = btn('<i class="bi bi-chevron-left"></i>', currentPage - 1, { disabled: currentPage === 1 });
  html += pages.map(p => p === '…'
    ? `<span style="color:var(--muted);padding:0 4px">…</span>`
    : btn(p, p, { active: p === currentPage })).join('');
  html += btn('<i class="bi bi-chevron-right"></i>', currentPage + 1, { disabled: currentPage === totalPages });
  html += `<span style="color:var(--muted);font-size:.78rem;margin-left:8px">Page ${currentPage} of ${totalPages}</span>`;
  nav.innerHTML = html;
}

function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Eligibility checker ───────────────────────────────────────────────────────
function toggleEligPanel() {
  const panel = document.getElementById('eligPanel');
  const btn = document.getElementById('eligToggleBtn');
  const opening = panel.style.display === 'none';
  panel.style.display = opening ? 'block' : 'none';
  btn.innerHTML = opening
    ? '<i class="bi bi-x-lg me-1"></i>Close'
    : '<i class="bi bi-sliders me-1"></i>Check my eligibility';
}

// Current student profile (built on apply) and a "show only eligible" toggle.
let eligStudent = null;
let eligOnlyEligible = true;

// Run the shared matcher for a program that has structured requirements_json.
// Returns the matchProgram result object, or null if no structured reqs.
function eligMatch(p) {
  if (!p || !p.requirements_json || !window.Eligibility) return null;
  const reqs = Eligibility.parseReqs(p.requirements_json);
  if (!reqs) return null;
  return Eligibility.matchProgram(eligStudent || {}, reqs);
}

// Legacy fallback for programs WITHOUT structured requirements_json.
function legacyEligible(p) {
  const c = eligCriteria;
  // GPA: legacy criteria stored normalized 0..100 (see applyEligibility)
  if (c.gpaPct !== null) {
    if (p.gpa_requirement) {
      const req = parseFloat(p.gpa_requirement);
      if (!isNaN(req) && c.gpaPct < req) return false;
    }
  }
  if (c.engType) {
    const progEng = p.english_req_type || 'None';
    if (progEng !== 'None') {
      if (progEng !== c.engType) return false;
      if (c.engScore !== null && p.english_req_score !== null) {
        if (parseFloat(p.english_req_score) > c.engScore) return false;
      }
    }
  }
  return true;
}

function meetsEligibility(p) {
  if (!eligActive) return true;
  // Budget / max-fee filtering applies regardless of structured vs legacy.
  if (eligCriteria.maxFee !== null && p.tuition_fee !== null && p.tuition_fee > eligCriteria.maxFee) return false;

  // When "show all" is off we only filter by eligibility; when on we still show
  // all and rely on the badge. The actual eligible/partial determination:
  const m = eligMatch(p);
  const isEligible = m ? m.eligible : legacyEligible(p);

  if (eligOnlyEligible) return isEligible;
  return true;
}

function applyEligibility() {
  const level = document.getElementById('eligLevel').value || 'none';
  const qualType = document.getElementById('eligQualType').value || '';
  const qualValue = document.getElementById('eligQualValue').value.trim();
  const gpaRaw = document.getElementById('eligGpa').value;
  const gpaScale = document.getElementById('eligGpaScale').value || '4.0';
  const engType = document.getElementById('eligEngType').value || '';
  const engScoreRaw = document.getElementById('eligEngScore').value;
  const stdType = document.getElementById('eligStdType').value || '';
  const stdScoreRaw = document.getElementById('eligStdScore').value;
  const maxFee = parseFloat(document.getElementById('eligFee').value);
  eligOnlyEligible = document.getElementById('eligOnlyEligible').checked;

  // Build the student profile expected by Eligibility.matchProgram.
  eligStudent = {
    level: level,
    gpa: gpaRaw, gpaScale: gpaScale,
    qualType: qualType, qualValue: qualValue,
    english: engType ? [{ test: engType, score: engScoreRaw }] : [],
    standardized: stdType ? [{ test: stdType, score: stdScoreRaw }] : [],
    budget: isNaN(maxFee) ? null : maxFee
  };

  // Legacy criteria (used only for programs without requirements_json).
  const engScore = parseFloat(engScoreRaw);
  eligCriteria = {
    gpaPct: gpaRaw !== '' && window.Eligibility ? Eligibility.normalizeGpa(gpaRaw, gpaScale) : null,
    engType: engType || null,
    engScore: isNaN(engScore) ? null : engScore,
    maxFee: isNaN(maxFee) ? null : maxFee
  };

  eligActive = !!(level !== 'none' || qualType || gpaRaw !== '' || engType || stdType || eligCriteria.maxFee !== null);

  applyFilters();

  const el = document.getElementById('eligResult');
  el.style.display = 'block';
  if (!eligActive) {
    el.innerHTML = '<i class="bi bi-info-circle me-1" style="color:var(--muted)"></i>Enter your profile above, then press Match.';
    return;
  }
  // Count truly-eligible programs across the whole catalogue (not just current page),
  // honouring the budget filter the same way the list does.
  let eligibleCount = 0;
  allPrograms.forEach(p => {
    if (eligCriteria.maxFee !== null && p.tuition_fee !== null && p.tuition_fee > eligCriteria.maxFee) return;
    const m = eligMatch(p);
    if (m ? m.eligible : legacyEligible(p)) eligibleCount++;
  });
  const criteria = [];
  if (level !== 'none') criteria.push(esc(level));
  if (qualType) criteria.push(esc(qualType) + (qualValue ? ' ' + esc(qualValue) : ''));
  if (gpaRaw !== '') criteria.push('GPA ' + esc(gpaRaw) + '/' + esc(gpaScale));
  if (engType) criteria.push(esc(engType) + (engScoreRaw ? ' ' + esc(engScoreRaw) : ''));
  if (stdType) criteria.push(esc(stdType) + (stdScoreRaw ? ' ' + esc(stdScoreRaw) : ''));
  if (eligCriteria.maxFee !== null) criteria.push('budget $' + eligCriteria.maxFee.toLocaleString());
  el.innerHTML = `<i class="bi bi-check-circle-fill me-1" style="color:#059669"></i>
    <b style="color:var(--text)">${eligibleCount} program${eligibleCount !== 1 ? 's' : ''}</b> match your profile
    ${criteria.length ? `<span style="color:var(--muted)"> · ${criteria.join(', ')}</span>` : ''}.
    <button onclick="clearEligibility()" style="background:none;border:none;color:var(--accent);font-size:.78rem;cursor:pointer;margin-left:8px;text-decoration:underline">Clear</button>`;
}

function clearEligibility() {
  document.getElementById('eligLevel').value = 'none';
  document.getElementById('eligQualType').value = '';
  document.getElementById('eligQualValue').value = '';
  document.getElementById('eligGpa').value = '';
  document.getElementById('eligGpaScale').value = '4.0';
  document.getElementById('eligEngType').value = '';
  document.getElementById('eligEngScore').value = '';
  document.getElementById('eligStdType').value = '';
  document.getElementById('eligStdScore').value = '';
  document.getElementById('eligFee').value = '';
  document.getElementById('eligOnlyEligible').checked = true;
  document.getElementById('eligResult').style.display = 'none';
  document.getElementById('maxFeeInput').value = '';
  document.getElementById('engFilter').value = '';
  eligActive = false;
  eligCriteria = {};
  eligStudent = null;
  eligOnlyEligible = true;
  applyFilters();
}

// ── Lead modal ────────────────────────────────────────────────────────────────
let leadCtx = {};

function openLeadModal(programId) {
  const p = allPrograms.find(x => x.id === programId);
  if (!p) return;
  leadCtx = { programId, programName: p.name, universityId: p.university_id, universityName: p.university_name, country: p.country };
  document.getElementById('leadProgName').textContent = leadCtx.programName;
  document.getElementById('leadUniName').textContent = leadCtx.universityName;
  document.getElementById('leadName').value = '';
  document.getElementById('leadEmail').value = '';
  document.getElementById('leadPhone').value = '';
  document.getElementById('leadMsg').value = '';
  document.getElementById('leadError').textContent = '';
  document.getElementById('leadSuccess').classList.add('d-none');
  document.getElementById('leadFormBody').classList.remove('d-none');
  document.getElementById('leadModal').style.display = 'flex';
}

function closeLeadModal() {
  document.getElementById('leadModal').style.display = 'none';
}

async function submitLead() {
  const btn = document.getElementById('leadSubmitBtn');
  const errEl = document.getElementById('leadError');
  errEl.textContent = '';
  const name = document.getElementById('leadName').value.trim();
  const email = document.getElementById('leadEmail').value.trim();
  const phone = document.getElementById('leadPhone').value.trim();
  const message = document.getElementById('leadMsg').value.trim();
  if (!name || !email) { errEl.textContent = 'Name and email are required.'; return; }
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const r = await fetch('/api/public/leads', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        student_name: name, email, phone, message,
        program_id: leadCtx.programId, program_name: leadCtx.programName,
        university_id: leadCtx.universityId, university_name: leadCtx.universityName,
        country: leadCtx.country
      })
    });
    const d = await r.json();
    if (!r.ok) { errEl.textContent = d.error || 'Something went wrong.'; return; }
    document.getElementById('leadFormBody').classList.add('d-none');
    document.getElementById('leadSuccess').classList.remove('d-none');
  } catch (e) {
    errEl.textContent = 'Network error — please try again.';
  } finally {
    btn.disabled = false; btn.textContent = 'Send Request';
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLeadModal(); });

init();
</script>

<!-- Lead Modal -->
<div id="leadModal" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(30,41,59,.45);align-items:center;justify-content:center;padding:16px" onclick="if(event.target===this)closeLeadModal()">
  <div style="background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:480px;padding:28px 28px 24px;box-shadow:var(--shadow-lg)">
    <div class="d-flex justify-content-between align-items-start mb-3">
      <div>
        <div style="font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Request Information</div>
        <div id="leadProgName" style="font-size:1rem;font-weight:700;color:var(--text);line-height:1.3"></div>
        <div id="leadUniName" style="font-size:.82rem;color:var(--accent);margin-top:2px"></div>
      </div>
      <button onclick="closeLeadModal()" style="background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:0 0 0 12px">&times;</button>
    </div>

    <div id="leadFormBody">
      <div class="mb-3">
        <input id="leadName" type="text" placeholder="Your full name *" style="width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 12px;font-size:.88rem;outline:none" onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='var(--line)'">
      </div>
      <div class="mb-3">
        <input id="leadEmail" type="email" placeholder="Email address *" style="width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 12px;font-size:.88rem;outline:none" onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='var(--line)'">
      </div>
      <div class="mb-3">
        <input id="leadPhone" type="tel" placeholder="Phone / WhatsApp (optional)" style="width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 12px;font-size:.88rem;outline:none" onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='var(--line)'">
      </div>
      <div class="mb-3">
        <textarea id="leadMsg" rows="3" placeholder="Any questions or comments (optional)" style="width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 12px;font-size:.88rem;outline:none;resize:vertical" onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='var(--line)'"></textarea>
      </div>
      <div id="leadError" style="color:#dc2626;font-size:.8rem;margin-bottom:8px"></div>
      <div class="d-flex gap-2">
        <button id="leadSubmitBtn" onclick="submitLead()" style="flex:1;background:var(--grad);border:none;color:#fff;font-weight:700;font-size:.9rem;padding:10px;border-radius:8px;cursor:pointer">Send Request</button>
        <button onclick="closeLeadModal()" style="background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:.88rem;padding:10px 16px;border-radius:8px;cursor:pointer">Cancel</button>
      </div>
    </div>

    <div id="leadSuccess" class="d-none text-center" style="padding:16px 0">
      <div style="font-size:2.5rem;margin-bottom:12px">✅</div>
      <div style="font-size:1.05rem;font-weight:700;color:var(--text);margin-bottom:6px">Request sent!</div>
      <div style="font-size:.85rem;color:var(--muted);margin-bottom:20px">We'll be in touch soon.</div>
      <button onclick="closeLeadModal()" style="background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:.88rem;padding:8px 20px;border-radius:8px;cursor:pointer">Close</button>
    </div>
  </div>
</div>

<script src="/js/chrome.js"></script>
</body>
