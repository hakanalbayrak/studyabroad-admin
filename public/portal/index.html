<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Öğrenci Paneli | PANELEDU</title>
  <meta name="robots" content="noindex">
  <link href="/vendor/bootstrap.min.css" rel="stylesheet">
  <link href="/css/site.css?v=20261009" rel="stylesheet">
  <link href="/css/icons.css" rel="stylesheet">
  <script src="/js/i18n.js"></script>
  <style>
    .dash-head { padding: clamp(22px, 4vw, 40px) 0 clamp(14px, 3vw, 22px); }
    .dash-head h1 { font-size: clamp(1.5rem, 3.6vw, 2.3rem); margin: 0 0 6px; }
    .dash-head h1 em { font-style: normal; color: var(--accent); }
    .dash-head p { color: var(--muted); margin: 0 0 16px; }
    .dash-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .tab-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .tab-btn { display: inline-flex; align-items: center; gap: 7px; min-height: 42px; padding: 8px 16px; border-radius: 99px; border: 1.5px solid var(--text); background: var(--surface); color: var(--text); font-weight: 600; font-size: .9rem; cursor: pointer; font-family: var(--f-body); }
    .tab-btn:hover { background: var(--mist); }
    .tab-btn.active { background: var(--sun); font-weight: 700; }
    .badge-status { font-size: .72rem; font-weight: 700; padding: 3px 11px; border-radius: 99px; border: 1.5px solid var(--text); white-space: nowrap; background: var(--mist); }
    .s-reviewing, .s-contacted { background: var(--sun); }
    .s-pre_accepted, .s-converted { background: #d6f5e3; }
    .s-conditional { background: #d9f2fb; }
    .s-new { background: #ffe5e6; }
    .s-closed { background: #e9e9ef; }
    .item-card, .uni-card, .profile-card { background: var(--surface); border: var(--bw) solid var(--text); border-radius: var(--r); padding: 16px 18px; margin-bottom: 12px; }
    .item-card:hover, .uni-card:hover { box-shadow: var(--shadow); transform: translate(-2px,-2px); }
    .item-card, .uni-card { transition: transform .12s, box-shadow .12s; }
    .card-title { font-family: var(--f-display); font-weight: 700; font-size: .98rem; letter-spacing: -.02em; margin-bottom: 3px; }
    .card-sub { color: var(--muted); font-size: .86rem; }
    .card-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; align-items: center; }
    .meta { font-size: .8rem; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
    .uni-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .uni-grid .uni-card { margin: 0; }
    .empty { text-align: center; padding: clamp(28px, 6vw, 56px) 16px; background: var(--surface); border: var(--bw) dashed var(--text); border-radius: var(--r); }
    .empty-icon { font-size: 2.4rem; display: block; margin-bottom: 10px; color: var(--accent); }
    .empty p { margin: 0 0 16px; color: var(--muted); line-height: 1.5; }
    .profile-card { max-width: 520px; padding: 24px; box-shadow: var(--shadow); }
    .profile-avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--sun); border: var(--bw) solid var(--text); display: flex; align-items: center; justify-content: center; font-family: var(--f-display); font-size: 1.4rem; font-weight: 800; }
    .form-ctrl { width: 100%; min-height: 44px; background: var(--surface); border: var(--bw) solid var(--text); color: var(--text); border-radius: var(--r-s); padding: 9px 12px; font-size: .95rem; font-family: var(--f-body); outline: none; }
    .form-ctrl:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(43,68,255,.2); }
    .form-ctrl:disabled { background: var(--surface-2); color: var(--muted); }
    .form-label { font-size: .82rem; font-weight: 600; margin-bottom: 5px; display: block; }
    .act-link { font-size: .8rem; font-weight: 600; color: var(--text); text-decoration: none; display: inline-flex; align-items: center; gap: 5px; border: 1.5px solid var(--text); border-radius: 8px; padding: 5px 11px; min-height: 34px; background: var(--surface); cursor: pointer; font-family: var(--f-body); }
    .act-link:hover { background: var(--mist); color: var(--text); }
    .act-link.danger { background: #ffe5e6; }
  </style>
</head>
<body class="pe-theme">
<main id="main">

<section class="dash-head">
  <div class="pe-wrap">
    <h1><span data-i18n="port.welcome">Tekrar hoş geldin,</span> <em id="greetName"></em></h1>
    <p id="welcomeSub"></p>
    <div class="dash-actions">
      <a href="/apply" class="btn-grad"><i class="bi bi-send-fill"></i><span data-i18n="port.apply">Yeni Başvuru</span></a>
      <a href="/programs" class="btn-ghost"><i class="bi bi-grid-3x3-gap"></i><span data-i18n="port.browse">Üniversitelere Gözat</span></a>
      <button type="button" class="btn-ghost" onclick="logout()"><i class="bi bi-box-arrow-right"></i><span data-i18n="port.logout">Çıkış</span></button>
    </div>
  </div>
</section>

<section class="pe-section-tight">
  <div class="pe-wrap">
  <div class="tab-bar" role="tablist">
    <button class="tab-btn active" id="tabBtnApps" type="button" onclick="showTab('apps')"><i class="bi bi-file-earmark-text"></i><span data-i18n="port.tab.apps">Başvurularım</span></button>
    <button class="tab-btn" id="tabBtnSaved" type="button" onclick="showTab('saved')"><i class="bi bi-bookmark-heart"></i><span data-i18n="port.tab.saved">Kaydedilenler</span></button>
    <button class="tab-btn" id="tabBtnLeads" type="button" onclick="showTab('leads')"><i class="bi bi-envelope"></i><span data-i18n="port.tab.leads">Sorgularım</span></button>
    <button class="tab-btn" id="tabBtnProfile" type="button" onclick="showTab('profile')"><i class="bi bi-person-circle"></i><span data-i18n="port.tab.profile">Profilim</span></button>
  </div>

  <div id="tabApps"><div id="appsList"><div class="text-center py-5" style="color:var(--muted)"><span class="spinner-border spinner-border-sm me-2"></span><span data-i18n="port.loading">Yükleniyor…</span></div></div></div>
  <div id="tabSaved" class="d-none"><div id="savedList"><div class="text-center py-5" style="color:var(--muted)"><span class="spinner-border spinner-border-sm me-2"></span><span data-i18n="port.loading">Yükleniyor…</span></div></div></div>
  <div id="tabLeads" class="d-none"><div id="leadsList"><div class="text-center py-5" style="color:var(--muted)"><span class="spinner-border spinner-border-sm me-2"></span><span data-i18n="port.loading">Yükleniyor…</span></div></div></div>

  <div id="tabProfile" class="d-none">
    <div class="profile-card">
      <div class="d-flex align-items-center gap-3 mb-4">
        <div class="profile-avatar" id="avatarInitial">?</div>
        <div>
          <div class="fw-bold" id="profileNameDisp"></div>
          <div class="small" style="color:var(--muted)" id="profileEmailDisp"></div>
        </div>
      </div>
      <div class="mb-3"><label class="form-label" for="profileName" data-i18n="port.profile.name">Ad Soyad</label><input type="text" id="profileName" class="form-ctrl" autocomplete="name"></div>
      <div class="mb-4"><label class="form-label" for="profileEmail" data-i18n="port.profile.email">E-posta</label><input type="email" id="profileEmail" class="form-ctrl" disabled autocomplete="email"></div>
      <button id="profileSaveBtn" class="btn-grad" type="button" onclick="saveProfile()"><span data-i18n="port.profile.save">Kaydet</span></button>
      <span id="profileSaveMsg" class="small ms-3" style="color:var(--ok);font-weight:600;display:none"></span>
    </div>
  </div>
  </div>
</section>

</main>

<script>
  function T(k){ return window.t ? window.t(k) : k; }
  function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  const token = localStorage.getItem('sa_token');
  const role  = localStorage.getItem('sa_role');
  const name  = localStorage.getItem('sa_name') || '';

  if (!token) { location.href = '/login?next=/portal'; }

    const first = name.split(' ')[0] || name;
  document.getElementById('greetName').textContent = first;
  document.getElementById('avatarInitial').textContent = (first[0] || '?').toUpperCase();

  const ref = new URLSearchParams(location.search).get('ref');
  if (ref) localStorage.setItem('sa_referral', ref);

  async function api(method, url, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(url, opts);
    if (res.status === 401) { logout(); return null; }
    return res;
  }

  function logout() {
    ['sa_token','sa_role','sa_name'].forEach(k => localStorage.removeItem(k));
    location.href = '/login';
  }

  function statusBadge(status) {
    const label = T('port.status.' + status) || status;
    return `<span class="badge-status s-${esc(status)}">${esc(label)}</span>`;
  }

  /* ── Tab management ── */
  let loaded = {};
  let activeTab = 'apps';

  function showTab(t) {
    activeTab = t;
    ['apps','saved','leads','profile'].forEach(id => {
      document.getElementById('tab' + id.charAt(0).toUpperCase() + id.slice(1)).classList.toggle('d-none', id !== t);
      document.getElementById('tabBtn' + id.charAt(0).toUpperCase() + id.slice(1)).classList.toggle('active', id === t);
    });
    if (!loaded[t]) {
      loaded[t] = true;
      if (t === 'apps')    loadApps();
      if (t === 'saved')   loadSaved();
      if (t === 'leads')   loadLeads();
      if (t === 'profile') loadProfile();
    }
  }

  /* ── Applications ── */
  async function loadApps() {
    const el = document.getElementById('appsList');
    const res = await api('GET', '/api/user/applications');
    if (!res) return;
    const list = await res.json();

    if (!list.length) {
      el.innerHTML = `<div class="empty">
        <i class="bi bi-file-earmark-text empty-icon"></i>
        <p>${T('port.apps.empty')}<br><span style="font-size:.83rem">${T('port.apps.empty.sub')}</span></p>
        <a href="/programs" class="btn-grad"><i class="bi bi-grid-3x3-gap"></i>${T('port.apps.browse')}</a>
      </div>`;
      return;
    }

    // Update welcome sub text
    document.getElementById('welcomeSub').textContent =
      list.length + ' ' + T(list.length === 1 ? 'port.apps.count.one' : 'port.apps.count.many');

    el.innerHTML = list.map(a => {
      const date = new Date(a.created_at).toLocaleDateString(
        (localStorage.getItem('paneleduLang') || 'tr') === 'tr' ? 'tr-TR' : 'en-GB'
      );
      const isAccepted = a.status === 'pre_accepted' || a.status === 'conditional';
      const docPart = a.doc_count > 0
        ? `<span class="meta"><i class="bi bi-paperclip"></i>${a.doc_count} ${a.doc_count === 1 ? T('port.apps.docs') : T('port.apps.docs.pl')}</span>`
        : '';
      const certLink = isAccepted && a.preaccept_ref
        ? `<a href="/acceptance?ref=${encodeURIComponent(a.preaccept_ref)}" class="act-link" target="_blank"><i class="bi bi-patch-check-fill"></i>${T('port.apps.cert')}</a>`
        : '';
      return `<div class="item-card">
        <div class="d-flex justify-content-between align-items-start gap-2 flex-wrap">
          <div class="flex-grow-1">
            <div class="card-title">${esc(a.university_name || '—')}</div>
            <div class="card-sub">${esc(a.program_name || '—')}${a.country ? ' · ' + esc(a.country) : ''}${a.desired_intake ? ' · ' + esc(a.desired_intake) : ''}</div>
          </div>
          <div>${statusBadge(a.status)}</div>
        </div>
        <div class="card-meta">
          <span class="meta"><i class="bi bi-calendar3"></i>${date}</span>
          ${docPart}
          ${certLink}
        </div>
      </div>`;
    }).join('');
  }

  /* ── Saved universities ── */
  async function loadSaved() {
    const el = document.getElementById('savedList');
    const res = await api('GET', '/api/user/saved');
    if (!res) return;
    const list = await res.json();
    if (!list.length) {
      el.innerHTML = `<div class="empty">
        <i class="bi bi-bookmark empty-icon"></i>
        <p>${T('port.saved.empty')}<br><span style="font-size:.83rem">${T('port.saved.browse')}</span></p>
        <a href="/programs" class="btn-grad"><i class="bi bi-grid-3x3-gap"></i>${T('port.browse')}</a>
      </div>`;
      return;
    }
    el.innerHTML = '<div class="uni-grid">' + list.map(u => `
      <div class="uni-card" id="uc-${u.id}">
        <div class="fw-semibold mb-1">${esc(u.name)}</div>
        <div class="card-sub mb-2"><i class="bi bi-geo-alt-fill"></i> ${esc([u.city,u.country].filter(Boolean).join(', '))}</div>
        <div class="mb-3">
          ${[u.qs_rank && `<span class="badge-status s-converted">QS #${u.qs_rank}</span>`, u.the_rank && `<span class="badge-status s-reviewing">THE #${u.the_rank}</span>`].filter(Boolean).join(' ')}
        </div>
        <div class="d-flex gap-2">
          <a href="/university?id=${u.id}" class="act-link"><i class="bi bi-arrow-right-circle"></i>${T('port.saved.view')}</a>
          <button type="button" onclick="unsave(${u.id},this)" class="act-link danger"><i class="bi bi-bookmark-x"></i>${T('port.saved.remove')}</button>
        </div>
      </div>`).join('') + '</div>';
  }

  async function unsave(id, btn) {
    btn.disabled = true;
    const res = await api('POST', '/api/user/saved', { entity_id: id });
    if (res) {
      const card = document.getElementById('uc-' + id);
      if (card) card.remove();
    }
  }

  /* ── Inquiries / Leads ── */
  async function loadLeads() {
    const el = document.getElementById('leadsList');
    const res = await api('GET', '/api/user/leads');
    if (!res) return;
    const list = await res.json();
    if (!list.length) {
      el.innerHTML = `<div class="empty"><i class="bi bi-envelope empty-icon"></i><p>${T('port.leads.empty')}</p></div>`;
      return;
    }
    const lang = localStorage.getItem('paneleduLang') || 'tr';
    el.innerHTML = list.map(l => {
      const date = new Date(l.created_at).toLocaleDateString(lang === 'tr' ? 'tr-TR' : 'en-GB');
      return `<div class="item-card">
        <div class="d-flex justify-content-between align-items-start gap-2 flex-wrap">
          <div class="flex-grow-1">
            <div class="card-title">${esc(l.university_name || '—')}</div>
            <div class="card-sub">${esc(l.program_name || '—')}</div>
          </div>
          <div>${statusBadge(l.status)}</div>
        </div>
        <div class="card-meta">
          <span class="meta"><i class="bi bi-calendar3"></i>${date}</span>
        </div>
      </div>`;
    }).join('');
  }

  /* ── Profile ── */
  async function loadProfile() {
    const res = await api('GET', '/api/user/profile');
    if (!res) return;
    const u = await res.json();
    document.getElementById('profileName').value = u.name || '';
    document.getElementById('profileEmail').value = u.email || '';
    document.getElementById('profileNameDisp').textContent = u.name || '';
    document.getElementById('profileEmailDisp').textContent = u.email || '';
    document.getElementById('avatarInitial').textContent = ((u.name || '?')[0]).toUpperCase();
  }

  async function saveProfile() {
    const name = document.getElementById('profileName').value.trim();
    if (!name) return;
    const btn = document.getElementById('profileSaveBtn');
    btn.disabled = true; btn.textContent = T('port.profile.saving');
    const res = await api('PATCH', '/api/user/profile', { name });
    btn.disabled = false; btn.textContent = T('port.profile.save');
    if (res && res.ok) {
      localStorage.setItem('sa_name', name);
            document.getElementById('greetName').textContent = name.split(' ')[0] || name;
      document.getElementById('profileNameDisp').textContent = name;
      document.getElementById('avatarInitial').textContent = (name[0] || '?').toUpperCase();
      const msg = document.getElementById('profileSaveMsg');
      msg.textContent = T('port.profile.saved'); msg.style.display = '';
      setTimeout(() => { msg.style.display = 'none'; }, 2500);
    }
  }

  /* ── Boot ── */
  loaded['apps'] = true;
  loadApps();
</script>
<script src="/js/chrome.js"></script>
</body>
</html>
