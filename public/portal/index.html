<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Öğrenci Paneli — PANELEDU</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="/js/i18n.js"></script>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #1e293b;
      --surface-2: #263044;
      --line: rgba(255,255,255,.08);
      --text: #e2e8f0;
      --muted: #64748b;
      --accent: #6366f1;
      --accent-lt: #818cf8;
      --grad: linear-gradient(135deg,#6366f1,#8b5cf6);
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; font-family: system-ui, -apple-system, sans-serif; }

    /* Topbar */
    .topbar { background: var(--surface); border-bottom: 1px solid var(--line); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .topbar-brand { color: var(--accent-lt); text-decoration: none; font-weight: 700; font-size: .95rem; display: flex; align-items: center; gap: 6px; }
    .topbar-brand:hover { color: var(--accent-lt); }
    .topbar-label { color: var(--muted); font-size: .82rem; padding-left: 12px; border-left: 1px solid var(--line); }
    .btn-topbar { background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 5px 12px; font-size: .82rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; transition: background .15s; }
    .btn-topbar:hover { background: rgba(255,255,255,.1); color: var(--text); }
    .btn-topbar.danger { color: #f87171; border-color: rgba(239,68,68,.3); }
    .btn-topbar.danger:hover { background: rgba(239,68,68,.12); }
    .btn-topbar.accent { background: var(--grad); border: none; color: #fff; font-weight: 600; }
    .btn-topbar.accent:hover { opacity: .88; }

    /* Welcome banner */
    .welcome-bar { background: linear-gradient(135deg,rgba(99,102,241,.18),rgba(139,92,246,.12)); border-bottom: 1px solid rgba(99,102,241,.2); padding: 20px 24px; }
    .welcome-bar h5 { font-size: 1.15rem; font-weight: 700; margin: 0 0 4px; }
    .welcome-bar p { margin: 0; color: var(--muted); font-size: .88rem; }

    /* Layout */
    .portal-wrap { max-width: 960px; margin: 0 auto; padding: 28px 16px 64px; }

    /* Tabs */
    .tab-bar { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
    .tab-btn { background: none; border: none; color: var(--muted); padding: 10px 16px; font-size: .88rem; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .12s; display: flex; align-items: center; gap: 6px; }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent-lt); border-bottom-color: var(--accent); }

    /* Status badges */
    .badge-status { font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
    .s-submitted   { background: rgba(99,102,241,.2); color: #a5b4fc; }
    .s-reviewing   { background: rgba(234,179,8,.2); color: #fbbf24; }
    .s-pre_accepted{ background: rgba(16,185,129,.2); color: #34d399; }
    .s-conditional { background: rgba(6,182,212,.2); color: #22d3ee; }
    .s-new         { background: rgba(239,68,68,.2); color: #f87171; }
    .s-contacted   { background: rgba(234,179,8,.2); color: #fbbf24; }
    .s-converted   { background: rgba(16,185,129,.2); color: #34d399; }
    .s-closed      { background: rgba(107,114,128,.2); color: #9ca3af; }

    /* Cards */
    .item-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; transition: border-color .15s; }
    .item-card:hover { border-color: rgba(99,102,241,.3); }
    .card-title { font-weight: 700; font-size: .95rem; margin-bottom: 3px; }
    .card-sub { color: var(--muted); font-size: .82rem; }
    .card-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }

    /* Empty state */
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-icon { font-size: 2.5rem; display: block; margin-bottom: 12px; }
    .empty p { margin: 0 0 16px; line-height: 1.5; }

    /* Uni grid */
    .uni-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .uni-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; transition: all .18s; }
    .uni-card:hover { border-color: rgba(99,102,241,.4); background: rgba(99,102,241,.07); }

    /* Profile */
    .profile-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; max-width: 480px; }
    .profile-avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--grad); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 700; color: #fff; flex-shrink: 0; }
    .form-ctrl { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: var(--text); border-radius: 8px; padding: 9px 12px; font-size: .9rem; width: 100%; outline: none; transition: border-color .15s; }
    .form-ctrl:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,.2); }
    .form-ctrl:disabled { color: var(--muted); cursor: default; }
    .form-label { font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: 5px; display: block; }
    .btn-save { background: var(--grad); border: none; color: #fff; font-weight: 700; padding: 9px 20px; border-radius: 8px; cursor: pointer; font-size: .88rem; transition: opacity .15s; }
    .btn-save:hover { opacity: .88; }
    .btn-save:disabled { opacity: .6; cursor: default; }

    /* Small action links */
    .act-link { font-size: .78rem; color: var(--accent-lt); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; border: 1px solid rgba(99,102,241,.3); border-radius: 6px; padding: 3px 9px; }
    .act-link:hover { background: rgba(99,102,241,.1); color: var(--accent-lt); }
    .act-link.danger { color: #f87171; border-color: rgba(239,68,68,.3); }
    .act-link.danger:hover { background: rgba(239,68,68,.1); }

    /* Lang toggle */
    .lang-btn { background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 4px 10px; font-size: .78rem; font-weight: 700; cursor: pointer; }
    .lang-btn:hover { color: var(--text); background: rgba(255,255,255,.1); }
  </style>
</head>
<body>

<div class="topbar">
  <div class="d-flex align-items-center gap-3">
    <a href="/" class="topbar-brand"><i class="bi bi-globe-americas"></i>PANELEDU</a>
    <span class="topbar-label" data-i18n="port.title">Öğrenci Paneli</span>
  </div>
  <div class="d-flex align-items-center gap-2">
    <span id="userName" class="small" style="color:var(--muted)"></span>
    <button class="lang-btn" id="portalLangBtn" onclick="panelangToggle ? panelangToggle() : location.reload()">EN</button>
    <a href="/programs" class="btn-topbar"><i class="bi bi-grid-3x3-gap"></i><span data-i18n="port.browse">Üniversitelere Gözat</span></a>
    <a href="/apply" class="btn-topbar accent"><i class="bi bi-send-fill"></i><span data-i18n="port.apply">Yeni Başvuru</span></a>
    <button class="btn-topbar danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i><span data-i18n="port.logout">Çıkış</span></button>
  </div>
</div>

<div class="welcome-bar">
  <div style="max-width:960px;margin:0 auto">
    <h5><span data-i18n="port.welcome">Tekrar hoş geldin,</span> <span id="greetName" style="color:var(--accent-lt)"></span> 👋</h5>
    <p id="welcomeSub" style="color:var(--muted);font-size:.88rem"></p>
  </div>
</div>

<div class="portal-wrap">
  <div class="tab-bar">
    <button class="tab-btn active" id="tabBtnApps" onclick="showTab('apps')">
      <i class="bi bi-file-earmark-text"></i><span data-i18n="port.tab.apps">Başvurularım</span>
    </button>
    <button class="tab-btn" id="tabBtnSaved" onclick="showTab('saved')">
      <i class="bi bi-bookmark-heart"></i><span data-i18n="port.tab.saved">Kaydedilenler</span>
    </button>
    <button class="tab-btn" id="tabBtnLeads" onclick="showTab('leads')">
      <i class="bi bi-envelope"></i><span data-i18n="port.tab.leads">Sorgularım</span>
    </button>
    <button class="tab-btn" id="tabBtnProfile" onclick="showTab('profile')">
      <i class="bi bi-person-circle"></i><span data-i18n="port.tab.profile">Profilim</span>
    </button>
  </div>

  <!-- Applications -->
  <div id="tabApps">
    <div id="appsList"><div class="text-muted text-center py-5"><span class="spinner-border spinner-border-sm me-2"></span><span data-i18n="port.loading">Yükleniyor…</span></div></div>
  </div>

  <!-- Saved universities -->
  <div id="tabSaved" class="d-none">
    <div id="savedList"><div class="text-muted text-center py-5"><span class="spinner-border spinner-border-sm me-2"></span><span data-i18n="port.loading">Yükleniyor…</span></div></div>
  </div>

  <!-- Inquiries -->
  <div id="tabLeads" class="d-none">
    <div id="leadsList"><div class="text-muted text-center py-5"><span class="spinner-border spinner-border-sm me-2"></span><span data-i18n="port.loading">Yükleniyor…</span></div></div>
  </div>

  <!-- Profile -->
  <div id="tabProfile" class="d-none">
    <div class="profile-card">
      <div class="d-flex align-items-center gap-3 mb-4">
        <div class="profile-avatar" id="avatarInitial">?</div>
        <div>
          <div class="fw-bold" id="profileNameDisp"></div>
          <div class="small" style="color:var(--muted)" id="profileEmailDisp"></div>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" data-i18n="port.profile.name">Ad Soyad</label>
        <input type="text" id="profileName" class="form-ctrl">
      </div>
      <div class="mb-4">
        <label class="form-label" data-i18n="port.profile.email">E-posta</label>
        <input type="email" id="profileEmail" class="form-ctrl" disabled>
      </div>
      <button id="profileSaveBtn" class="btn-save" onclick="saveProfile()"><span data-i18n="port.profile.save">Kaydet</span></button>
      <span id="profileSaveMsg" class="small ms-3" style="color:#34d399;display:none"></span>
    </div>
  </div>
</div>

<script>
  function T(k){ return window.t ? window.t(k) : k; }
  function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  const token = localStorage.getItem('sa_token');
  const role  = localStorage.getItem('sa_role');
  const name  = localStorage.getItem('sa_name') || '';

  if (!token) { location.href = '/login?next=/portal'; }

  // Update lang toggle button label
  (function () {
    var btn = document.getElementById('portalLangBtn');
    if (btn) btn.textContent = (localStorage.getItem('paneleduLang') || 'tr') === 'tr' ? 'EN' : 'TR';
  })();

  document.getElementById('userName').textContent = name;
  const first = name.split(' ')[0] || name;
  document.getElementById('greetName').textContent = first;
  document.getElementById('avatarInitial').textContent = (first[0] || '?').toUpperCase();

  const ref = new URLSearchParams(location.search).get('ref');
  if (ref) localStorage.setItem('sa_referral', ref);

  async function api(method, url, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(url, opts);
    if (res.status === 401) { logout(); return null; }
    return res;
  }

  function logout() {
    ['sa_token','sa_role','sa_name'].forEach(k => localStorage.removeItem(k));
    location.href = '/login';
  }

  function statusBadge(status) {
    const label = T('port.status.' + status) || status;
    return `<span class="badge-status s-${esc(status)}">${esc(label)}</span>`;
  }

  /* ── Tab management ── */
  let loaded = {};
  let activeTab = 'apps';

  function showTab(t) {
    activeTab = t;
    ['apps','saved','leads','profile'].forEach(id => {
      document.getElementById('tab' + id.charAt(0).toUpperCase() + id.slice(1)).classList.toggle('d-none', id !== t);
      document.getElementById('tabBtn' + id.charAt(0).toUpperCase() + id.slice(1)).classList.toggle('active', id === t);
    });
    if (!loaded[t]) {
      loaded[t] = true;
      if (t === 'apps')    loadApps();
      if (t === 'saved')   loadSaved();
      if (t === 'leads')   loadLeads();
      if (t === 'profile') loadProfile();
    }
  }

  /* ── Applications ── */
  async function loadApps() {
    const el = document.getElementById('appsList');
    const res = await api('GET', '/api/user/applications');
    if (!res) return;
    const list = await res.json();

    if (!list.length) {
      el.innerHTML = `<div class="empty">
        <i class="bi bi-file-earmark-text empty-icon"></i>
        <p>${T('port.apps.empty')}<br><span style="font-size:.83rem">${T('port.apps.empty.sub')}</span></p>
        <a href="/programs" class="btn-topbar accent" style="display:inline-flex;margin:0 auto"><i class="bi bi-grid-3x3-gap me-1"></i>${T('port.apps.browse')}</a>
      </div>`;
      return;
    }

    // Update welcome sub text
    document.getElementById('welcomeSub').textContent =
      list.length + ' ' + (list.length === 1 ? T('port.tab.apps').replace('My ', '').toLowerCase() : T('port.tab.apps').replace('My ', '').toLowerCase());

    el.innerHTML = list.map(a => {
      const date = new Date(a.created_at).toLocaleDateString(
        (localStorage.getItem('paneleduLang') || 'tr') === 'tr' ? 'tr-TR' : 'en-GB'
      );
      const isAccepted = a.status === 'pre_accepted' || a.status === 'conditional';
      const docPart = a.doc_count > 0
        ? `<span style="font-size:.76rem;color:var(--muted)"><i class="bi bi-paperclip me-1"></i>${a.doc_count} ${a.doc_count === 1 ? T('port.apps.docs') : T('port.apps.docs.pl')}</span>`
        : '';
      const certLink = isAccepted && a.preaccept_ref
        ? `<a href="/acceptance?ref=${encodeURIComponent(a.preaccept_ref)}" class="act-link" target="_blank"><i class="bi bi-patch-check-fill"></i>${T('port.apps.cert')}</a>`
        : '';
      return `<div class="item-card">
        <div class="d-flex justify-content-between align-items-start gap-2 flex-wrap">
          <div class="flex-grow-1">
            <div class="card-title">${esc(a.university_name || '—')}</div>
            <div class="card-sub">${esc(a.program_name || '—')}${a.country ? ' · ' + esc(a.country) : ''}${a.desired_intake ? ' · ' + esc(a.desired_intake) : ''}</div>
          </div>
          <div>${statusBadge(a.status)}</div>
        </div>
        <div class="card-meta">
          <span style="font-size:.76rem;color:var(--muted)"><i class="bi bi-calendar3 me-1"></i>${date}</span>
          ${docPart}
          ${certLink}
        </div>
      </div>`;
    }).join('');
  }

  /* ── Saved universities ── */
  async function loadSaved() {
    const el = document.getElementById('savedList');
    const res = await api('GET', '/api/user/saved');
    if (!res) return;
    const list = await res.json();
    if (!list.length) {
      el.innerHTML = `<div class="empty">
        <i class="bi bi-bookmark empty-icon"></i>
        <p>${T('port.saved.empty')}<br><span style="font-size:.83rem">${T('port.saved.browse')}</span></p>
        <a href="/" class="btn-topbar accent" style="display:inline-flex;margin:0 auto"><i class="bi bi-grid-3x3-gap me-1"></i>${T('port.browse')}</a>
      </div>`;
      return;
    }
    el.innerHTML = '<div class="uni-grid">' + list.map(u => `
      <div class="uni-card" id="uc-${u.id}">
        <div class="fw-semibold mb-1">${esc(u.name)}</div>
        <div class="small mb-2" style="color:var(--muted)"><i class="bi bi-geo-alt-fill me-1"></i>${esc([u.city,u.country].filter(Boolean).join(', '))}</div>
        <div class="mb-3">
          ${[u.qs_rank && `<span class="badge-status s-pre_accepted">QS #${u.qs_rank}</span>`, u.the_rank && `<span class="badge-status s-reviewing">THE #${u.the_rank}</span>`].filter(Boolean).join(' ')}
        </div>
        <div class="d-flex gap-2">
          <a href="/university?id=${u.id}" class="act-link"><i class="bi bi-arrow-right-circle"></i>${T('port.saved.view')}</a>
          <button onclick="unsave(${u.id},this)" class="act-link danger" style="cursor:pointer;background:none"><i class="bi bi-bookmark-x"></i>${T('port.saved.remove')}</button>
        </div>
      </div>`).join('') + '</div>';
  }

  async function unsave(id, btn) {
    btn.disabled = true;
    const res = await api('POST', '/api/user/saved', { entity_id: id });
    if (res) {
      const card = document.getElementById('uc-' + id);
      if (card) card.remove();
    }
  }

  /* ── Inquiries / Leads ── */
  async function loadLeads() {
    const el = document.getElementById('leadsList');
    const res = await api('GET', '/api/user/leads');
    if (!res) return;
    const list = await res.json();
    if (!list.length) {
      el.innerHTML = `<div class="empty"><i class="bi bi-envelope empty-icon"></i><p>${T('port.leads.empty')}</p></div>`;
      return;
    }
    const lang = localStorage.getItem('paneleduLang') || 'tr';
    el.innerHTML = list.map(l => {
      const date = new Date(l.created_at).toLocaleDateString(lang === 'tr' ? 'tr-TR' : 'en-GB');
      return `<div class="item-card">
        <div class="d-flex justify-content-between align-items-start gap-2 flex-wrap">
          <div class="flex-grow-1">
            <div class="card-title">${esc(l.university_name || '—')}</div>
            <div class="card-sub">${esc(l.program_name || '—')}</div>
          </div>
          <div>${statusBadge(l.status)}</div>
        </div>
        <div class="card-meta">
          <span style="font-size:.76rem;color:var(--muted)"><i class="bi bi-calendar3 me-1"></i>${date}</span>
        </div>
      </div>`;
    }).join('');
  }

  /* ── Profile ── */
  async function loadProfile() {
    const res = await api('GET', '/api/user/profile');
    if (!res) return;
    const u = await res.json();
    document.getElementById('profileName').value = u.name || '';
    document.getElementById('profileEmail').value = u.email || '';
    document.getElementById('profileNameDisp').textContent = u.name || '';
    document.getElementById('profileEmailDisp').textContent = u.email || '';
    document.getElementById('avatarInitial').textContent = ((u.name || '?')[0]).toUpperCase();
  }

  async function saveProfile() {
    const name = document.getElementById('profileName').value.trim();
    if (!name) return;
    const btn = document.getElementById('profileSaveBtn');
    btn.disabled = true; btn.textContent = T('port.profile.saving');
    const res = await api('PATCH', '/api/user/profile', { name });
    btn.disabled = false; btn.textContent = T('port.profile.save');
    if (res && res.ok) {
      localStorage.setItem('sa_name', name);
      document.getElementById('userName').textContent = name;
      document.getElementById('greetName').textContent = name.split(' ')[0] || name;
      document.getElementById('profileNameDisp').textContent = name;
      document.getElementById('avatarInitial').textContent = (name[0] || '?').toUpperCase();
      const msg = document.getElementById('profileSaveMsg');
      msg.textContent = T('port.profile.saved'); msg.style.display = '';
      setTimeout(() => { msg.style.display = 'none'; }, 2500);
    }
  }

  /* ── Boot ── */
  loaded['apps'] = true;
  loadApps();
</script>
</body>
</html>
