<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Abroad — Find Your University</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --accent: #6366f1; }
    body { background: #0b1120; color: #e2e8f0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; }

    /* Hero */
    .hero { background: linear-gradient(135deg, #0b1120 0%, #1e1b4b 50%, #0b1120 100%); padding: 64px 0 52px; text-align: center; }
    .hero h1 { font-size: clamp(1.9rem, 4vw, 3.2rem); font-weight: 800; background: linear-gradient(90deg, #818cf8, #c084fc, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
    .hero p { color: #94a3b8; font-size: 1.05rem; max-width: 500px; margin: 0 auto 32px; }

    /* Search bar */
    .search-wrap { max-width: 680px; margin: 0 auto 16px; }
    .search-bar { display: flex; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.15); border-radius: 14px; overflow: hidden; transition: border-color .15s, box-shadow .15s; }
    .search-bar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(99,102,241,.2); }
    .search-bar input { flex: 1; background: transparent; border: none; color: #e2e8f0; padding: 14px 18px; font-size: 1rem; outline: none; }
    .search-bar input::placeholder { color: #475569; }
    .search-bar button { background: var(--accent); border: none; color: #fff; padding: 0 22px; font-weight: 700; font-size: .9rem; cursor: pointer; transition: opacity .15s; }
    .search-bar button:hover { opacity: .88; }
    .search-filters { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .search-filters select { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); color: #e2e8f0; border-radius: 8px; padding: 7px 12px; font-size: .83rem; cursor: pointer; }
    .search-filters select:focus { outline: none; border-color: var(--accent); }
    .search-filters select option { background: #1e293b; }
    .btn-programs { background: rgba(99,102,241,.18); border: 1px solid rgba(99,102,241,.35); color: #a5b4fc; border-radius: 8px; padding: 7px 16px; font-size: .83rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: all .15s; }
    .btn-programs:hover { background: rgba(99,102,241,.3); color: #c7d2fe; }

    /* Stats */
    #statsBar { background: rgba(255,255,255,.03); border-top: 1px solid rgba(255,255,255,.06); border-bottom: 1px solid rgba(255,255,255,.06); padding: 10px 0; }
    #statsBar .stat { font-size: .8rem; color: #64748b; }
    #statsBar .stat b { color: #94a3b8; }

    /* Section headers */
    .sec-label { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: #64748b; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .sec-label span { flex: 1; height: 1px; background: rgba(255,255,255,.07); }

    /* University cards */
    .uni-card {
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px; overflow: hidden; transition: all .18s; cursor: pointer;
      display: flex; flex-direction: column; height: 100%;
    }
    .uni-card:hover { background: rgba(99,102,241,.09); border-color: rgba(99,102,241,.4); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,.4); }
    .card-top { padding: 18px 18px 12px; flex: 1; }
    .card-name { font-size: .93rem; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; line-height: 1.35; }
    .card-location { font-size: .76rem; color: #64748b; margin-bottom: 8px; }
    .card-ranks { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
    .rank-badge { font-size: .68rem; font-weight: 700; padding: 2px 7px; border-radius: 20px; }
    .rank-qs  { background: rgba(99,102,241,.25); color: #a5b4fc; }
    .rank-the { background: rgba(16,185,129,.2);  color: #6ee7b7; }
    .rank-sh  { background: rgba(245,158,11,.2);  color: #fcd34d; }
    .card-desc { font-size: .76rem; color: #94a3b8; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-footer-strip { background: rgba(99,102,241,.1); padding: 9px 18px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .view-label { font-size: .74rem; color: #94a3b8; font-weight: 600; }
    .orbit-btn-sm { background: rgba(99,102,241,.2); border: 1px solid rgba(99,102,241,.4); color: #818cf8; font-size: .7rem; font-weight: 600; border-radius: 6px; padding: 3px 10px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .orbit-btn-sm:hover { background: rgba(99,102,241,.35); }
    .featured-star { font-size: .68rem; background: rgba(250,204,21,.15); color: #fbbf24; border: 1px solid rgba(250,204,21,.3); border-radius: 20px; padding: 1px 7px; font-weight: 700; }

    /* Pagination */
    #paginationWrap { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; padding: 24px 0 8px; }
    .pg-btn { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); color: #94a3b8; border-radius: 8px; padding: 5px 12px; font-size: .82rem; cursor: pointer; min-width: 36px; transition: all .12s; }
    .pg-btn:hover:not(:disabled) { background: rgba(99,102,241,.2); border-color: rgba(99,102,241,.4); color: #a5b4fc; }
    .pg-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
    .pg-btn:disabled { opacity: .3; cursor: default; }
    #perPageSel { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); color: #94a3b8; border-radius: 8px; padding: 5px 10px; font-size: .8rem; }
    #perPageSel option { background: #1e293b; }

    /* Empty / loading */
    #emptyMsg { text-align: center; color: #475569; padding: 60px 0; }
    #loadingSpinner { text-align: center; color: #64748b; padding: 60px 0; }
    .spinner-ring { width: 36px; height: 36px; border: 3px solid rgba(99,102,241,.2); border-top-color: #6366f1; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #resultInfo { font-size: .8rem; color: #64748b; margin-bottom: 16px; }
  </style>
</head>
<body>

<!-- Hero -->
<div class="hero">
  <div class="container">
    <div class="mb-3"><i class="bi bi-globe-americas" style="font-size:2.5rem;color:#818cf8"></i></div>
    <h1>Find Your Study Destination</h1>
    <p>Search universities and programs across 24 countries. Compare, explore campuses in 3D, and apply.</p>

    <div class="search-wrap">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search universities…" autocomplete="off" oninput="onSearch()">
        <button onclick="onSearch()"><i class="bi bi-search me-1"></i>Search</button>
      </div>
    </div>

    <div class="search-filters">
      <select id="countryFilter" onchange="onSearch()">
        <option value="">All Countries</option>
      </select>
      <select id="orbitFilter" onchange="onSearch()">
        <option value="">All</option>
        <option value="orbit">3D Orbit available</option>
        <option value="no-orbit">No orbit yet</option>
      </select>
      <a href="/programs" class="btn-programs"><i class="bi bi-mortarboard-fill"></i>Browse Programs</a>
    </div>
  </div>
</div>

<!-- Stats -->
<div id="statsBar">
  <div class="container d-flex gap-4 flex-wrap justify-content-center">
    <span class="stat"><b id="stTotal">—</b> universities</span>
    <span class="stat"><b id="stOrbit">—</b> with 3D orbit</span>
    <span class="stat"><b id="stCountries">—</b> countries</span>
    <span class="stat"><b id="stFeatured">—</b> featured</span>
  </div>
</div>

<!-- Content -->
<div style="padding: 36px 0 64px">
  <div class="container">
    <div id="loadingSpinner"><div class="spinner-ring"></div>Loading…</div>

    <!-- Featured section (shown when no search) -->
    <div id="featuredSection" class="d-none">
      <div class="sec-label"><i class="bi bi-star-fill" style="color:#fbbf24"></i>Featured Universities <span></span></div>
      <div class="row g-3" id="featuredGrid"></div>
    </div>

    <!-- Search results (shown when searching) -->
    <div id="searchSection" class="d-none">
      <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
        <div class="sec-label mb-0"><i class="bi bi-search"></i>Search Results <span style="min-width:40px"></span></div>
        <div class="d-flex align-items-center gap-2">
          <span style="font-size:.78rem;color:#64748b" id="searchResultInfo"></span>
          <select id="perPageSel" onchange="goPage(1)">
            <option value="10">10 / page</option>
            <option value="25" selected>25 / page</option>
            <option value="50">50 / page</option>
          </select>
        </div>
      </div>
      <div id="emptyMsg" class="d-none"><i class="bi bi-search" style="font-size:2rem;display:block;margin-bottom:12px"></i>No universities match your search.</div>
      <div class="row g-3" id="searchGrid"></div>
      <div id="searchPagination"></div>
    </div>
  </div>
</div>

<script>
let allUniversities = [];
let filteredUniversities = [];
let currentPage = 1;
let isSearching = false;

async function load() {
  try {
    allUniversities = await fetch('/api/public/universities').then(r => r.json());
    buildCountryFilter();
    updateStats();
    document.getElementById('loadingSpinner').style.display = 'none';
    showFeatured();
  } catch (e) {
    document.getElementById('loadingSpinner').innerHTML = '<i class="bi bi-exclamation-circle" style="font-size:2rem;display:block;margin-bottom:12px;color:#f87171"></i>Could not load universities.';
  }
}

function buildCountryFilter() {
  const countries = [...new Set(allUniversities.map(u => u.country).filter(Boolean))].sort();
  const sel = document.getElementById('countryFilter');
  countries.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
}

function hasOrbit(u) { return !!(u.latitude && u.longitude); }

function updateStats() {
  document.getElementById('stTotal').textContent = allUniversities.length;
  document.getElementById('stOrbit').textContent = allUniversities.filter(hasOrbit).length;
  document.getElementById('stCountries').textContent = new Set(allUniversities.map(u => u.country).filter(Boolean)).size;
  document.getElementById('stFeatured').textContent = allUniversities.filter(u => u.featured).length;
}

function showFeatured() {
  isSearching = false;
  document.getElementById('featuredSection').classList.remove('d-none');
  document.getElementById('searchSection').classList.add('d-none');

  const featured = allUniversities.filter(u => u.featured);
  document.getElementById('featuredGrid').innerHTML = featured.length
    ? featured.map(u => cardHtml(u, true)).join('')
    : '<div class="col-12"><p class="text-muted small" style="color:#475569">No featured universities yet — mark some as Featured in the admin panel.</p></div>';
}

function onSearch() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const country = document.getElementById('countryFilter').value;
  const orbitF = document.getElementById('orbitFilter').value;
  const hasFilters = q || country || orbitF;

  if (!hasFilters) { showFeatured(); return; }

  isSearching = true;
  document.getElementById('featuredSection').classList.add('d-none');
  document.getElementById('searchSection').classList.remove('d-none');

  filteredUniversities = allUniversities.filter(u => {
    if (q && !u.name.toLowerCase().includes(q) && !(u.city||'').toLowerCase().includes(q) && !(u.country||'').toLowerCase().includes(q)) return false;
    if (country && u.country !== country) return false;
    if (orbitF === 'orbit' && !hasOrbit(u)) return false;
    if (orbitF === 'no-orbit' && hasOrbit(u)) return false;
    return true;
  });

  currentPage = 1;
  renderSearchResults();
}

function renderSearchResults() {
  const perPage = parseInt(document.getElementById('perPageSel').value) || 25;
  const total = filteredUniversities.length;
  const totalPages = Math.max(1, Math.ceil(total / perPage));
  currentPage = Math.min(currentPage, totalPages);
  const start = (currentPage - 1) * perPage;
  const slice = filteredUniversities.slice(start, start + perPage);

  document.getElementById('emptyMsg').classList.toggle('d-none', total > 0);
  document.getElementById('searchGrid').innerHTML = slice.map(u => cardHtml(u, false)).join('');
  document.getElementById('searchResultInfo').textContent = total + ' result' + (total !== 1 ? 's' : '');
  renderPagination(totalPages, perPage, total, start);
}

function goPage(p) {
  currentPage = p;
  renderSearchResults();
  window.scrollTo({ top: document.getElementById('searchSection').offsetTop - 20, behavior: 'smooth' });
}

function renderPagination(totalPages, perPage, total, start) {
  const wrap = document.getElementById('searchPagination');
  if (totalPages <= 1) { wrap.innerHTML = ''; return; }
  const showing = Math.min(start + perPage, total);
  let html = `<div id="paginationWrap">
    <button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹ Prev</button>`;
  const range = pageRange(currentPage, totalPages);
  range.forEach(p => {
    if (p === '...') html += `<span class="pg-btn" style="cursor:default">…</span>`;
    else html += `<button class="pg-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
  });
  html += `<button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>Next ›</button>`;
  html += `<span style="font-size:.75rem;color:#475569;margin-left:4px">${start+1}–${showing} of ${total}</span>`;
  html += `</div>`;
  wrap.innerHTML = html;
}

function pageRange(cur, total) {
  if (total <= 7) return Array.from({length: total}, (_,i) => i+1);
  const pages = new Set([1, total, cur]);
  if (cur > 1) pages.add(cur-1);
  if (cur < total) pages.add(cur+1);
  const sorted = [...pages].sort((a,b) => a-b);
  const result = [];
  let prev = 0;
  for (const p of sorted) {
    if (p - prev > 1) result.push('...');
    result.push(p);
    prev = p;
  }
  return result;
}

function cardHtml(u, isFeatured) {
  const orbit = hasOrbit(u);
  const ranks = [];
  if (u.qs_rank) ranks.push(`<span class="rank-badge rank-qs">QS #${u.qs_rank}</span>`);
  if (u.the_rank) ranks.push(`<span class="rank-badge rank-the">THE #${u.the_rank}</span>`);
  if (u.shanghai_rank) ranks.push(`<span class="rank-badge rank-sh">SH #${u.shanghai_rank}</span>`);
  return `<div class="${isFeatured ? 'col-12 col-sm-6 col-lg-4' : 'col-12 col-sm-6 col-lg-4'}">
    <div class="uni-card" onclick="goToDetail(${u.id})">
      <div class="card-top">
        <div class="d-flex align-items-start justify-content-between gap-1 mb-1">
          <div class="card-name">${esc(u.name)}</div>
          ${u.featured ? '<span class="featured-star flex-shrink-0">★ Featured</span>' : ''}
        </div>
        <div class="card-location"><i class="bi bi-geo-alt-fill me-1" style="color:#475569"></i>${[u.city, u.country].filter(Boolean).join(', ')}</div>
        ${ranks.length ? `<div class="card-ranks">${ranks.join('')}</div>` : ''}
        ${u.description_en ? `<div class="card-desc">${esc(u.description_en)}</div>` : ''}
      </div>
      <div class="card-footer-strip">
        <span class="view-label"><i class="bi bi-mortarboard-fill me-1" style="color:#818cf8"></i>View Programs</span>
        ${orbit ? `<button class="orbit-btn-sm" onclick="event.stopPropagation();openOrbit(${u.id})"><i class="bi bi-camera-video-fill me-1"></i>3D Orbit</button>` : '<span style="font-size:.7rem;color:#334155">No orbit yet</span>'}
      </div>
    </div>
  </div>`;
}

function goToDetail(id) { window.location.href = '/university?id=' + id; }

function openOrbit(id) {
  const u = allUniversities.find(x => x.id === id);
  if (!u) return;
  const lat   = u.orbit_center_lat  ?? u.latitude;
  const lng   = u.orbit_center_lng  ?? u.longitude;
  const alt   = u.orbit_altitude    ?? 400;
  const pitch = u.orbit_pitch       ?? -45;
  const head  = u.orbit_initial_heading ?? 0;
  const range = u.orbit_range       ?? 400;
  const speed = u.orbit_rotation_speed ?? 0.12;
  const rot   = u.orbit_rotation_type  ?? '360';
  const params = new URLSearchParams({ name: u.name, uniId: u.id, lat, lng, alt, pitch, heading: head, range, speed, rot });
  if (u.scan_target_lat && u.scan_target_lng) {
    params.set('scanLat', u.scan_target_lat);
    params.set('scanLng', u.scan_target_lng);
    params.set('scan', u.scan_effect_enabled ? '1' : '0');
  }
  window.open('/orbit?' + params.toString(), '_blank');
}

function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

load();
</script>
</body>
</html>
