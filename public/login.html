<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — PANELEDU</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="/js/i18n.js"></script>
  <style>
    body { background: #0b1120; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
    .card { background: #1e293b; border: 1px solid rgba(255,255,255,.08); border-radius: 16px; width: 380px; padding: 40px; }
    .form-control { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: #e2e8f0; }
    .form-control:focus { background: rgba(255,255,255,.09); border-color: #6366f1; color: #f1f5f9; box-shadow: 0 0 0 3px rgba(99,102,241,.2); }
    .form-control::placeholder { color: #475569; }
    .btn-primary { background: #6366f1; border-color: #6366f1; }
    .btn-primary:hover { background: #4f46e5; border-color: #4f46e5; }
    a { color: #818cf8; cursor: pointer; }
    .code-input { letter-spacing: 8px; text-align: center; font-size: 1.4rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card shadow-lg">
    <div class="text-center mb-4">
      <i class="bi bi-globe-americas" style="font-size:2.4rem;color:#818cf8"></i>
      <h5 class="fw-bold mt-2 mb-0 text-white">PANELEDU</h5>
      <p class="text-muted small mt-1" id="subtitle" data-i18n="login.sub.default">Sign in with your email</p>
    </div>
    <div id="errBox" class="alert alert-danger d-none small py-2 mb-3"></div>
    <div id="okBox" class="alert alert-success d-none small py-2 mb-3"></div>

    <!-- Step 1: email (OTP request) -->
    <div id="emailStep">
      <div class="mb-3">
        <label class="form-label small fw-semibold text-muted" data-i18n="login.email.lbl">Email</label>
        <input type="email" id="email" class="form-control" data-i18n-ph="login.email.ph" placeholder="you@example.com" autocomplete="email">
      </div>
      <button id="otpBtn" class="btn btn-primary w-100 fw-semibold" onclick="requestCode()"><i class="bi bi-envelope me-1"></i><span data-i18n="login.otp.btn">Email me a sign-in code</span></button>
    </div>

    <!-- Step 2: code entry -->
    <div id="codeStep" class="d-none">
      <p class="small text-muted mb-2"><span data-i18n="login.code.hint">Enter the 6-digit code we sent to</span> <strong id="codeEmailLabel"></strong>.</p>
      <input type="text" inputmode="numeric" maxlength="6" id="code" class="form-control code-input mb-3" placeholder="••••••">
      <button id="verifyBtn" class="btn btn-primary w-100 fw-semibold" onclick="verifyCode()" data-i18n="login.verify.btn">Verify &amp; Sign In</button>
      <div class="text-center small mt-3">
        <a onclick="resendCode()" data-i18n="login.resend">Resend code</a> · <a onclick="backToEmail()" data-i18n="login.diff.email">Use a different email</a>
      </div>
    </div>

    <!-- Staff password login -->
    <div id="pwStep" class="d-none">
      <div class="mb-3">
        <label class="form-label small fw-semibold text-muted" data-i18n="login.email.lbl">Email</label>
        <input type="email" id="pwEmail" class="form-control" data-i18n-ph="login.email.ph" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold text-muted" data-i18n="login.pw.lbl">Password</label>
        <input type="password" id="pwPassword" class="form-control" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button id="pwBtn" class="btn btn-primary w-100 fw-semibold" onclick="passwordLogin()" data-i18n="login.pw.btn">Sign In</button>
    </div>

    <hr style="border-color:rgba(255,255,255,.08);margin:20px 0">
    <div class="text-center small text-muted">
      <a id="staffToggle" onclick="showPassword()" data-i18n="login.staff.toggle">Staff sign-in (password)</a>
      <span id="backToOtpWrap" class="d-none"><a onclick="showOtp()" data-i18n="login.back.otp">← Sign in with email code</a></span>
    </div>
    <div class="text-center small mt-2">
      <a href="/" style="color:#475569" data-i18n="login.back.home">← Back to home</a>
    </div>
  </div>
  <script>
    const nextParam = new URLSearchParams(location.search).get('next');
    function $(id){ return document.getElementById(id); }
    function T(k){ return window.t ? window.t(k) : k; }
    function showErr(m){ $('okBox').classList.add('d-none'); const e=$('errBox'); e.textContent=m; e.classList.remove('d-none'); }
    function showOk(m){ $('errBox').classList.add('d-none'); const e=$('okBox'); e.textContent=m; e.classList.remove('d-none'); }
    function clearMsg(){ $('errBox').classList.add('d-none'); $('okBox').classList.add('d-none'); }

    function finishLogin(d){
      localStorage.setItem('sa_token', d.token);
      localStorage.setItem('sa_role', d.role);
      localStorage.setItem('sa_name', d.name);
      if (d.role === 'admin') location.href = '/admin';
      else if (d.role === 'affiliate') location.href = '/affiliate';
      else location.href = nextParam || '/portal';
    }

    // ── OTP flow ──
    let otpEmail = '';
    async function requestCode(){
      const email = $('email').value.trim();
      clearMsg();
      if (!email) { showErr(T('login.err.email')); return; }
      const btn = $('otpBtn'); btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>' + T('login.sending');
      try {
        const res = await fetch('/api/auth/otp/request', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email }) });
        const d = await res.json();
        if (!res.ok) throw new Error(d.error || T('login.err.email'));
        otpEmail = email;
        $('codeEmailLabel').textContent = email;
        $('emailStep').classList.add('d-none');
        $('codeStep').classList.remove('d-none');
        $('subtitle').textContent = T('login.sub.check');
        showOk(T('login.code.sent'));
        $('code').focus();
      } catch(e){ showErr(e.message); }
      finally { btn.disabled = false; btn.innerHTML = '<i class="bi bi-envelope me-1"></i>' + T('login.otp.btn'); }
    }
    function resendCode(){ $('email').value = otpEmail; backToEmail(); requestCode(); }
    function backToEmail(){ $('codeStep').classList.add('d-none'); $('emailStep').classList.remove('d-none'); $('subtitle').textContent=T('login.sub.default'); clearMsg(); }
    async function verifyCode(){
      const code = $('code').value.trim();
      clearMsg();
      if (!/^\d{6}$/.test(code)) { showErr(T('login.err.code')); return; }
      const btn = $('verifyBtn'); btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>' + T('login.verifying');
      try {
        const res = await fetch('/api/auth/otp/verify', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email: otpEmail, code }) });
        const d = await res.json();
        if (!res.ok) throw new Error(d.error || 'Invalid code');
        finishLogin(d);
      } catch(e){ showErr(e.message); btn.disabled=false; btn.textContent=T('login.verify.btn'); }
    }

    // ── Password flow (staff) ──
    async function passwordLogin(){
      const email = $('pwEmail').value.trim();
      const password = $('pwPassword').value;
      clearMsg();
      if (!email || !password) { showErr(T('login.err.fields')); return; }
      const btn = $('pwBtn'); btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>' + T('login.signing');
      try {
        const res = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, password }) });
        const d = await res.json();
        if (!res.ok) throw new Error(d.error || 'Login failed');
        finishLogin(d);
      } catch(e){ showErr(e.message); btn.disabled=false; btn.textContent=T('login.pw.btn'); }
    }

    // ── View toggles ──
    function showPassword(){ $('emailStep').classList.add('d-none'); $('codeStep').classList.add('d-none'); $('pwStep').classList.remove('d-none'); $('staffToggle').classList.add('d-none'); $('backToOtpWrap').classList.remove('d-none'); $('subtitle').textContent=T('login.sub.staff'); clearMsg(); }
    function showOtp(){ $('pwStep').classList.add('d-none'); $('emailStep').classList.remove('d-none'); $('staffToggle').classList.remove('d-none'); $('backToOtpWrap').classList.add('d-none'); $('subtitle').textContent=T('login.sub.default'); clearMsg(); }

    $('email').addEventListener('keydown', e => { if (e.key==='Enter') requestCode(); });
    $('code').addEventListener('keydown', e => { if (e.key==='Enter') verifyCode(); });
    $('pwPassword').addEventListener('keydown', e => { if (e.key==='Enter') passwordLogin(); });
  </script>
</body>
</html>
