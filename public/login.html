<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Study Abroad</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #0b1120; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
    .card { background: #1e293b; border: 1px solid rgba(255,255,255,.08); border-radius: 16px; width: 380px; padding: 40px; }
    .form-control { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: #e2e8f0; }
    .form-control:focus { background: rgba(255,255,255,.09); border-color: #6366f1; color: #f1f5f9; box-shadow: 0 0 0 3px rgba(99,102,241,.2); }
    .form-control::placeholder { color: #475569; }
    .btn-primary { background: #6366f1; border-color: #6366f1; }
    .btn-primary:hover { background: #4f46e5; border-color: #4f46e5; }
    a { color: #818cf8; }
  </style>
</head>
<body>
  <div class="card shadow-lg">
    <div class="text-center mb-4">
      <i class="bi bi-globe-americas" style="font-size:2.4rem;color:#818cf8"></i>
      <h5 class="fw-bold mt-2 mb-0 text-white">Study Abroad</h5>
      <p class="text-muted small mt-1">Sign in to your account</p>
    </div>
    <div id="errBox" class="alert alert-danger d-none small py-2 mb-3"></div>
    <div class="mb-3">
      <label class="form-label small fw-semibold text-muted">Email</label>
      <input type="email" id="email" class="form-control" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="mb-4">
      <label class="form-label small fw-semibold text-muted">Password</label>
      <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button id="loginBtn" class="btn btn-primary w-100 fw-semibold" onclick="doLogin()">Sign In</button>
    <hr style="border-color:rgba(255,255,255,.08);margin:20px 0">
    <div class="text-center small text-muted">
      New student? <a href="/register">Create an account</a>
    </div>
    <div class="text-center small mt-2">
      <a href="/" style="color:#475569">← Back to home</a>
    </div>
  </div>
  <script>
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const err = document.getElementById('errBox');
      const btn = document.getElementById('loginBtn');
      err.classList.add('d-none');
      if (!email || !password) { err.textContent = 'Enter email and password.'; err.classList.remove('d-none'); return; }
      btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in…';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ email, password })
        });
        const d = await res.json();
        if (!res.ok) throw new Error(d.error || 'Login failed');
        localStorage.setItem('sa_token', d.token);
        localStorage.setItem('sa_role', d.role);
        localStorage.setItem('sa_name', d.name);
        const next = new URLSearchParams(location.search).get('next');
        if (d.role === 'admin') location.href = '/admin';
        else if (d.role === 'affiliate') location.href = '/affiliate';
        else location.href = next || '/portal';
      } catch (e) {
        err.textContent = e.message; err.classList.remove('d-none');
        btn.disabled = false; btn.innerHTML = 'Sign In';
      }
    }
  </script>
</body>
</html>
